# This differs from target_platform in that it determines what subdir the compiler
# will target, not what subdir the compiler package will be itself.
c_stdlib:
  - sysroot                     # [linux]
  - macosx_deployment_target    # [osx]
c_stdlib_version:
  - 2.17                        # [linux]
  - 10.13                       # [osx]

c_compiler:
  - gcc                        # [linux]
c_compiler_version:            # [unix]
  - 11                         # [linux]
cxx_compiler:
  - gxx                        # [linux]
cxx_compiler_version:          # [unix]
  - 11                         # [linux]
fortran_compiler:              # [unix or win64]
  - gfortran                   # [linux or (osx and x86_64)]
fortran_compiler_version:      # [unix or win64]
  - 11                         # [linux]
_libgcc_mutex:
  - 0.1 scns_forge
#
# Go Compiler Options
#

# The basic go-compiler with CGO disabled,
# It generates fat binaries without libc dependencies
# The activation scripts will set your CC,CXX and related flags
# to invalid values.
go_compiler:
  - go-nocgo
# The go compiler build with CGO enabled.
# It can generate fat binaries that depend on conda's libc.
# You should use this compiler if the underlying
# program needs to link against other C libraries, in which
# case make sure to add  'c,cpp,fortran_compiler' for unix
# and the m2w64 equivalent for windows.
cgo_compiler:
  - go-cgo
# The following are helpful variables to simplify go meta.yaml files.
target_goos:
  - linux                      # [linux]
target_goarch:
  - amd64                      # [x86_64]
target_goexe:
  -                            # [unix]
  - .exe                       # [win]
target_gobin:
  - '${PREFIX}/bin/'           # [unix]
  - '%PREFIX%\bin\'            # [win]

# Rust Compiler Options
rust_compiler:
  - rust

VERBOSE_AT:
  - V=1
VERBOSE_CM:
  - VERBOSE=1

cdt_name:  # [linux]
  - cos7   # [linux]
cdt_build_number:
  - '106' # keep in sync with that in cdts

zip_keys:
  -                             # [unix]
    - c_compiler_version        # [unix]
    - cxx_compiler_version      # [unix]
    - fortran_compiler_version  # [unix]
  -
    - python
    - numpy
    - python_impl

python_min:
  - 3.10

pin_run_as_build:
  # boost is special, see https://github.com/conda-forge/boost-cpp-feedstock/pull/82
  boost:
    max_pin: x.x.x
  boost-cpp:
    max_pin: x.x.x
  # TODO: add run_exports to the following feedstocks
  flann:
    max_pin: x.x.x
  graphviz:
    max_pin: x
  libsvm:
    max_pin: x
  netcdf-cxx4:
    max_pin: x.x
  occt:
    max_pin: x.x
  poppler:
    max_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
  vlfeat:
    max_pin: x.x.x

CI:
  # - circleci
  - github
  # - gitlab
  # - travis

# Pinning packages: every package that export binary interface used by
# other packages shall be pinned. Be sure to update this list if a new version
# is bumped.

