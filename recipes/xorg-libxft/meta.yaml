{% set xorg_name = "libXft" %}
{% set xorg_category = "lib" %}
{% set name = "xorg-libXft" %}
{% set version = "2.3.4" %}
{% set sha256 = "57dedaab20914002146bdae0cb0c769ba3f75214c4c91bd2613d6ef79fc9abdd" %}
{% set am_version = "1.15" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # url: ../../pkgs/libXft-2.3.4.tar.bz2
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.bz2
  sha256: {{ sha256 }}

build:
  number: 1
  detect_binary_files_with_prefix: true
  # Would need some library futzing to get the build fully working on Windows:
  skip: true  # [win]

requirements:
  build:
    - m2-autoconf  # [win]
    - m2-automake{{ am_version }}  # [win]
    - m2-libtool  # [win]
    - m2w64-pkg-config  # [win]
    - pkg-config  # [not win]
    - posix  # [win]
    - {{ compiler('c') }}        # [unix]
    - {{ compiler('m2w64_c') }}  # [win]
    - make  # [unix]
    - freetype
    - zlib
  host:
    - pthread-stubs
    - xorg-util-macros
    - xorg-libx11 1.7.*
    - xorg-libxrender 0.9.*
    - freetype
    - zlib
    - fontconfig
  run:
    - xorg-libx11 1.7.*
    - xorg-libxrender 0.9.*
    - freetype
    - fontconfig

test:
  commands:
    - test -f $PREFIX/lib/libXft.dylib  # [osx]
    - test -f $PREFIX/lib/libXft.so  # [linux]
    - if not exist %PREFIX%/Library/lib/libXft.dll.a exit /b 1  # [win]
    - if not exist %PREFIX%/Library/bin/msys-Xft-*.dll exit /b 1  # [win]

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: The X.org FreeType library.

extra:
  recipe-maintainers:
    - pkgw
    - epruesse
