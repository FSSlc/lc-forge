schema_version: 1

context:
  version: "0.16"

package:
  name: chrpath
  version: ${{ version }}

source:
  url: http://pkgs.fedoraproject.org/repo/pkgs/chrpath/chrpath-${{ version }}.tar.gz/2bf8d1d1ee345fc8a7915576f5649982/chrpath-${{ version }}.tar.gz
  sha256: bb0d4c54bac2990e1bdf8132f2c9477ae752859d523e141e72b3b11a12c26e7b

build:
  number: 1003
  skip: win or osx

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - gnuconfig
    - make
  host:

tests:
  - script:
      - chrpath --help
      - chrpath --version

about:
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Tool to edit the rpath in ELF binaries.
  description: |
    'chrpath is a command line tool to adjust the RPATH or RUNPATH of ELF
    binaries.'
  homepage: http://packages.qa.debian.org/c/chrpath.html
  repository: https://www.openhub.net/p/chrpath
  documentation: https://alioth.debian.org/projects/chrpath/

extra:
  recipe-maintainers:
    - ocefpaf
    - xhochy

