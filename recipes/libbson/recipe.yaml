schema_version: 1

context:
  name: libbson
  version: "1.23.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/mongodb/mongo-c-driver/releases/download/${{ version }}/mongo-c-driver-${{ version }}.tar.gz
  sha256: 123c358827eea07cd76a31c40281bb1c81b6744f6587c96d0cf217be8b1234e3
  patches:
    - if: osx
      then: fix-malloc-osx.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - cmake
    - ninja
  host:
  run:
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then: test -f ${PREFIX}/include/libbson-1.0/bson/bson.h
      - if: unix
        then: test -f ${PREFIX}/lib/pkgconfig/libbson-1.0.pc
      - if: unix
        then: test -f ${PREFIX}/lib/libbson-1.0${SHLIB_EXT}
      - if: win
        then: if not exist %LIBRARY_INC%\libbson-1.0\bson\bson.h (exit 1)
      - if: win
        then: if not exist %LIBRARY_LIB%\bson-1.0.lib (exit 1)
      - if: win
        then: if not exist %LIBRARY_BIN%\bson-1.0.dll (exit 1)

about:
  license: Apache-2.0
  license_file: COPYING
  summary: A library providing useful routines related to building, parsing, and iterating BSON documents.
  homepage: https://github.com/mongodb/mongo-c-driver

extra:
  recipe-maintainers:
    - Tobias-Fischer

