schema_version: 1

context:
  version: "1.15.3"
  # scns ships numpy 1.23.5 only; scipy is pinned to the numpy it is built against
  numpy: "1.23"

package:
  name: scipy
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/scipy/scipy-${{ version }}.tar.gz
  sha256: eae3cf522bc7df64b42cad3925c876e1b0b6c35c1337c93e12c0f366f55b0eaf

build:
  number: 0
  skip: match(python, "<3.10")
  script:
    - if: unix
      then: bash "$RECIPE_DIR/build.sh"
    - if: unix
      then: bash "$RECIPE_DIR/build-output.sh"
    - if: win
      then: build-output.bat

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: numpy ${{ numpy }}.*
    - if: build_platform != target_platform
      then: pybind11
    - if: build_platform != target_platform
      then: meson-python
    - if: build_platform != target_platform
      then: cmake
    - if: build_platform != target_platform
      then: ninja
    - if: build_platform != target_platform
      then: pkg-config
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
  host:
    - libblas
    - libcblas
    - liblapack
    - python
    - cython
    # for https://github.com/scipy/scipy/issues/25904
    - meson <1.12
    - meson-python
    - ninja
    - pkg-config
    - python-build
    - pybind11
    - pythran
    - numpy ${{ numpy }}.*
    - pip
  run:
    - python
    # built against numpy 1.23, so the binaries use the numpy 1.x C ABI
    - numpy >=1.23.5,<2.0a0

tests:
  - python:
      imports:
        - scipy
        - scipy.cluster
        - scipy.cluster.hierarchy
        - scipy.cluster.vq
        - scipy.constants
        - scipy.datasets
        - scipy.fft
        - scipy.fftpack
        - scipy.integrate
        - scipy.interpolate
        - scipy.io
        - scipy.io.arff
        - scipy.io.matlab
        - scipy.io.wavfile
        - scipy.linalg
        - scipy.linalg.blas
        - scipy.linalg.cython_blas
        - scipy.linalg.cython_lapack
        - scipy.linalg.interpolative
        - scipy.linalg.lapack
        - scipy.misc
        - scipy.ndimage
        - scipy.odr
        - scipy.optimize
        - scipy.signal
        - scipy.signal.windows
        - scipy.sparse
        - scipy.sparse.csgraph
        - scipy.sparse.linalg
        - scipy.spatial
        - scipy.spatial.distance
        - scipy.spatial.transform
        - scipy.special
        - scipy.stats
        - scipy.stats.contingency
        - scipy.stats.distributions
        - scipy.stats.mstats
        - scipy.stats.qmc
        - scipy.stats.sampling
      pip_check: false
  - requirements:
      run:
        - pytest
        - hypothesis
    script:
      # test folders and testing DSOs are not shipped in this package
      - python -c "import pathlib, sys, scipy; base = pathlib.Path(scipy.__file__).parent; bad = [d for d in sys.argv[1:] if (base / d).exists()]; print('unexpected test dirs:', bad); sys.exit(1 if bad else 0)" _lib/tests cluster/tests constants/tests datasets/tests fftpack/tests fft/tests integrate/tests interpolate/tests io/tests linalg/tests misc/tests ndimage/tests odr/tests optimize/tests signal/tests sparse/tests spatial/tests special/tests stats/tests
      - python -c "import pathlib, sys, scipy; base = pathlib.Path(scipy.__file__).parent; bad = [p.name for n in sys.argv[1:] for p in base.glob(n + '.*.so')]; print('unexpected test libs:', bad); sys.exit(1 if bad else 0)" _lib/_test_ccallback integrate/_test_multivariate io/_test_fortran ndimage/_ctest ndimage/_cytest special/_test_internal
      # scipy.test() must fail with an informative message pointing at the upstream test suite
      - python -c "import scipy; throw_away_the_return_value = scipy.test()" > testlog
      - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('conda-forge builds of' in x for x in lines) else 1)"
      - (pytest --pyargs scipy || echo "failure was expected") > testlog
      - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('conda-forge builds of' in x for x in lines) else 1)"
      - python -c "import sys; lines=open('testlog').readlines(); sys.exit(0 if any('======== 1 failed' in x for x in lines) else 1)"
      # BLAS/LAPACK smoke test
      - python -c "import numpy as np, scipy.linalg as la; a = np.random.RandomState(0).rand(200, 200); b = la.solve(a @ a.T + 200*np.eye(200), np.ones(200)); assert np.allclose((a @ a.T + 200*np.eye(200)) @ b, 1); print('linalg ok')"

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Scientific Library for Python
  description: |
    SciPy is a Python-based ecosystem of open-source software for mathematics,
    science, and engineering.
  homepage: http://www.scipy.org/
  repository: https://github.com/scipy/scipy
  documentation: http://www.scipy.org/docs.html

extra:
  recipe-maintainers:
    - lc
