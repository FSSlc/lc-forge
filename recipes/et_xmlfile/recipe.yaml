schema_version: 1

context:
  name: et_xmlfile
  version: 2.0.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: dab3f4764309081ce75662649be815c4c9081e88f0837825f90fd28317d4da54

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - et_xmlfile
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  license: MIT
  license_file: LICENCE.rst
  summary: An implementation of lxml.xmlfile for the standard library
  description: |
    et_xmlfile is a low memory library for creating large XML files.
  homepage: https://foss.heptapod.net/openpyxl/et_xmlfile
  repository: https://foss.heptapod.net/openpyxl/et_xmlfile
  documentation: https://et-xmlfile.readthedocs.io

extra:
  recipe-maintainers:
    - curtisalexander
    - synapticarbors
