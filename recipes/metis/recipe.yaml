schema_version: 1

context:
  name: metis
  version: "5.2.1"
  gklib_tree_ish: 8bd6bad750b2b0d90800c632cf18e8ee93ad72d7

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/KarypisLab/METIS/archive/v${{ version }}.tar.gz
    sha256: 1a4665b2cd07edc2f734e30d7460afb19c1217c2547c2ac7bf6e1848d50aff7a
    patches:
      - if: win
        then: patches/0004-uncomment-width-variables.patch
      # See https://github.com/KarypisLab/METIS/issues/54:
      - patches/getprocvmpeak.diff
      # https://github.com/KarypisLab/METIS/pull/52
      - patches/pr52.patch
      # missing Windows conditionals
      - patches/rusage-win32.patch
      - patches/msvc-no-libm.patch
      # remove -march=native, never appropriate on conda-forge,
      # unavailable on ppc64le
      - patches/no-march-native.patch
      # fix libmetis installation paths
      - patches/fix-libmetis-install-paths.patch
  - url: https://github.com/KarypisLab/GKlib/archive/${{ gklib_tree_ish }}.tar.gz
    sha256: e1d59de12336731e6dde8465f05de7b907fae5d72c921cffcde217a89eaab654
    target_directory: GKlib
    patches:
      - patches/gklib-remove-march-and-werror-flags.patch
      - patches/gklib-xopen-source.patch
      - patches/gklib-remove-test-with-embedded-assembler.patch
      - patches/gklib-includes.patch

build:
  number: 1
  dynamic_linking:
    binary_relocation: true

requirements:
  build:
    - cmake <4.0
    - make
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  run_exports:
    - ${{ pin_subpackage('metis', upper_bound='x.x.x') }}

tests:
  - files:
      source:
        - graphs
    script:
      - if: unix
        then: graphchk
      - if: unix
        then: cmpfillin -h
      - if: unix
        then: mpmetis -h
      - if: unix
        then: gpmetis -h
      - if: unix
        then: ndmetis -h
      - if: unix
        then: gpmetis -h
      - if: unix
        then: m2gmetis -h
      - if: unix
        then: test -f $PREFIX/include/metis.h
      - if: osx
        then: test -f $PREFIX/lib/libmetis.dylib
      - if: linux
        then: test -f $PREFIX/lib/libmetis.so
      - if: win
        then: if not exist "%LIBRARY_LIB%\\metis.lib" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\graphchk.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\cmpfillin.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\mpmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\gpmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\ndmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\gpmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\m2gmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_INC%\\metis.h" exit 1

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - GKlib/LICENSE.txt
  summary: METIS - Serial Graph Partitioning and Fill-reducing Matrix Ordering
  description: |
    METIS is a set of serial programs for partitioning graphs, partitioning
    finite element meshes, and producing fill reducing orderings for sparse
    matrices. The algorithms implemented in METIS are based on the multilevel
    recursive-bisection, multilevel k-way, and multi-constraint partitioning
    schemes developed in our lab.
  homepage: http://glaros.dtc.umn.edu/gkhome/metis/metis/overview
  repository: https://github.com/KarypisLab/METIS.git
  documentation: http://glaros.dtc.umn.edu/gkhome/metis/metis/faq

extra:
  recipe-maintainers:
    - basnijholt
    - SylvainCorlay
    - mikemhenry
    - matthiasdiener
    - zklaus

