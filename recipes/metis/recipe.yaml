# While Metis is a pure C library, it is built with cmake, which assumes C++
# by defaults and attempts to locate the C++ compiler. Hence the recipe has a
# build dependency on {{ compiler('cxx') }}. The `ignore_run_exports` entry is
# added so that the package does not depend on the C++ runtime due to the
# dependency to the C++ compiler.
#
# Another fix to this would be to have metis' cmake specify `project(METIS C)`
# instead of `project(METIS)`.
schema_version: 1

context:
  name: metis
  version: "5.1.0"
  sha256: 76faebe03f6c963127dbb73c13eab58c9a3faeae48779f049066a21c087c5db2
  build: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://karypis.github.io/glaros/files/sw/metis/metis-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - vc14.patch

build:
  number: ${{ build }}
  dynamic_linking:
    binary_relocation: true

requirements:
  build:
    - cmake
    - make
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  run_exports:
    - ${{ pin_subpackage('metis', upper_bound='x.x') }}
  ignore_run_exports:
    by_name:
      - if: linux
        then: libstdcxx-ng
      - if: osx
        then: libcxx

tests:
  - files:
      source:
        - graphs
    script:
      - if: unix
        then: graphchk
      - if: unix
        then: cmpfillin -h
      - if: unix
        then: mpmetis -h
      - if: unix
        then: gpmetis -h
      - if: unix
        then: ndmetis -h
      - if: unix
        then: gpmetis -h
      - if: unix
        then: m2gmetis -h
      - if: unix
        then: test -f $PREFIX/include/metis.h
      - if: osx
        then: test -f $PREFIX/lib/libmetis.dylib
      - if: linux
        then: test -f $PREFIX/lib/libmetis.so
      - if: win
        then: if not exist "%LIBRARY_LIB%\\metis.lib" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\graphchk.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\cmpfillin.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\mpmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\gpmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\ndmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\gpmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_BIN%\\m2gmetis.exe" exit 1
      - if: win
        then: if not exist "%LIBRARY_INC%\\metis.h" exit 1

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: METIS - Serial Graph Partitioning and Fill-reducing Matrix Ordering
  description: |
    METIS is a set of serial programs for partitioning graphs, partitioning
    finite element meshes, and producing fill reducing orderings for sparse
    matrices. The algorithms implemented in METIS are based on the multilevel
    recursive-bisection, multilevel k-way, and multi-constraint partitioning
    schemes developed in our lab.
  homepage: http://glaros.dtc.umn.edu/gkhome/metis/metis/overview
  documentation: http://glaros.dtc.umn.edu/gkhome/metis/metis/faq

extra:
  recipe-maintainers:
    - basnijholt
    - SylvainCorlay

