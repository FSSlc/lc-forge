schema_version: 1

context:
  xorg_name: font-util
  xorg_category: font
  name: xorg-font-util
  version: 1.3.2
  sha256: 3ad880444123ac06a7238546fa38a2a6ad7f7e0cc3614de7e103863616522282
  am_version: 1.15  # keep synchronized with build.sh

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # url: ../../pkgs/font-util-1.3.2.tar.bz2
  # fn: {{ xorg_name }}-{{ version }}.tar.bz2
  url: https://www.x.org/releases/individual/${{ xorg_category }}/${{ xorg_name }}-${{ version }}.tar.bz2
  sha256: ${{ sha256 }}

build:
  number: 0
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - if: win
      then: m2-autoconf
    - if: win
      then: m2-automake${{ am_version }}
    - if: win
      then: m2-libtool
    - if: win
      then: m2w64-pkg-config
    - if: not win
      then: pkg-config
    - if: win
      then: posix
    - if: unix
      then: ${{ compiler('c') }}
    - if: unix
      then: make
    - if: win
      then: ${{ compiler('m2w64_c') }}
  host:
    - xorg-util-macros
  run:

tests:
  - script:
      - if: not win
        then: conda inspect linkages -p $PREFIX $PKG_NAME
      - if: osx
        then: conda inspect objects -p $PREFIX $PKG_NAME

about:
  license: MIT
  license_file: COPYING
  summary: X.org font-related utilities.
  homepage: https://www.x.org/

extra:
  recipe-maintainers:
    - pkgw

