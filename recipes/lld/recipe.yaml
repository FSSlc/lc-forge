schema_version: 1

context:
  version: "21.1.8"

package:
  name: lld
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version | replace(".rc", "-rc") }}.tar.gz
  sha256: 7ba3f2a8d8fda88be18a31d011e8195d3b7f87f9fa92b20c94cba2d7f65b0e3f
  patches:
    - patches/0001-point-header-inclusion-in-lld-MachO-CMakeLists.txt-t.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - if: build_platform != target_platform
      then: llvmdev ==${{ version }}
  host:
    - if: osx
      then: libcxx ${{ cxx_compiler_version }}
    - llvmdev ==${{ version }}
    - llvm
    # these they are present in the host env anyway as run-deps of llvm
    # and will be picked up for the build by the default settings
    - libxml2-devel
    - zlib
    - zstd
  run:
    - if: osx
      then: ${{ pin_compatible("libcxx", upper_bound=None) }}
  ignore_run_exports:
    from_package:
      - if: unix
        then: libxml2-devel
  run_constraints:
    - llvm ==${{ version }}

tests:
  - script:
      - if: linux
        then: ld.lld --version
      - if: win
        then: lld-link /?

about:
  license: Apache-2.0 WITH LLVM-exception
  license_file: lld/LICENSE.TXT
  summary: The LLVM Linker
  homepage: https://lld.llvm.org/
  repository: https://github.com/llvm/llvm-project/

extra:
  recipe-maintainers:
    - isuruf
    - h-vetinari

