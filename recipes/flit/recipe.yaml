schema_version: 1

context:
  version: "3.12.0"
  python_min: "3.10"

package:
  name: flit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flit/flit-${{ version }}.tar.gz
  sha256: 1c80f34dd96992e7758b40423d2809f48f640ca285d0b7821825e50745ec3740
  target_directory: source

build:
  number: 0
  noarch: python
  script: cd source/ && FLIT_ROOT_INSTALL=1 python -m flit install --deps=none
  python:
    entry_points:
      - flit = flit:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - docutils
    - requests
    - tomli-w
    - flit-core 3.12.0.*
  run:
    - python >=${{ python_min }}
    - pip
    - docutils
    - requests
    - tomli-w
    - flit-core 3.12.0.*

tests:
  - python:
      imports:
        - flit
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - flit --version

about:
  license: BSD-3-Clause
  license_file: source/LICENSE
  summary: Simplified packaging of Python modules
  homepage: https://flit.pypa.io/

extra:
  recipe-maintainers:
    - Carreau
    - minrk
    - takluyver
    - ocefpaf

