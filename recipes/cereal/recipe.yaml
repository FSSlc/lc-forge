schema_version: 1

context:
  name: cereal
  version: "1.3.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/USCiLab/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 16a7ad9b31ba5880dac55d62b5d6f243c3ebc8d46a3514149e56b5e7ea81f85f
  patches:
    # remove cxx compiler dependency
    - no-compiler.patch
    # ref: https://github.com/USCiLab/cereal/pull/835
    - template-apply.patch

build:
  number: 1
  noarch: generic

requirements:
  build:
    - cmake
    - ninja

tests:
  - script:
      - if: not win
        then: test -f $PREFIX/include/cereal/cereal.hpp
      - if: win
        then: if not exist %LIBRARY_INC%\\cereal\\cereal.hpp exit 1

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A C++11 library for serialization
  homepage: http://uscilab.github.io/cereal/
  repository: http://github.com/USCiLab/cereal
  documentation: http://uscilab.github.io/cereal/

extra:
  recipe-maintainers:
    - saraedum
    - joaander

