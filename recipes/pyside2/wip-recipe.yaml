schema_version: 1

context:
  version: 5.15.4

package:
  name: pyside2
  version: ${{ version }}

source:
  # url: ../../pkgs/pyside-setup-opensource-src-{{ version }}.tar.xz
  url: https://download.qt.io/official_releases/QtForPython/pyside2/PySide2-${{ version }}-src/pyside-setup-opensource-src-${{ version }}.tar.xz
  sha256: 3c68ed0def4111ef5d0641370306338d277ae8983a77eaf22f223ddd3a14450b
  patches:
    # https://bugreports.qt.io/browse/PYSIDE-1193
    - patches/pyi.patch
    - patches/python3.10.patch
    - patches/windows_dll_shiboken_fix.patch
    - if: win
      then: patches/fix_genererate_pyi.patch
    - patches/pyside2-tools-obsolete.patch

build:
  number: 1
  python:
    entry_points:
      - pyside2-designer = PySide2.scripts.pyside_tool:designer
      - pyside2-rcc = PySide2.scripts.pyside_tool:rcc
      - pyside2-uic = PySide2.scripts.pyside_tool:uic
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - clangdev
    - if: linux
      then:
        - ${{ cdt('xorg-x11-proto-devel') }}
        - ${{ cdt('libx11-devel') }}
        - ${{ cdt('libxext-devel') }}
        - ${{ cdt('libxrender-devel') }}
        - ${{ cdt('mesa-libgl-devel') }}
        - ${{ cdt('mesa-libegl-devel') }}
        - ${{ cdt('mesa-dri-drivers') }}
        - ${{ cdt('libxau-devel') }}
        - ${{ cdt('alsa-lib-devel') }}
        - ${{ cdt('gtk2-devel') }}
        - ${{ cdt('gtkmm24-devel') }}
        - ${{ cdt('libdrm-devel') }}
        - ${{ cdt('libxcomposite-devel') }}
        - ${{ cdt('libxcursor-devel') }}
        - ${{ cdt('libxi-devel') }}
        - ${{ cdt('libxrandr-devel') }}
        - ${{ cdt('pciutils-devel') }}
        - ${{ cdt('libxscrnsaver-devel') }}
        - ${{ cdt('libxtst-devel') }}
        - ${{ cdt('libselinux-devel') }}
        - ${{ cdt('libxdamage') }}
        - ${{ cdt('libxdamage-devel') }}
        - ${{ cdt('libxfixes') }}
        - ${{ cdt('libxfixes-devel') }}
        - ${{ cdt('libxxf86vm') }}
        - ${{ cdt('libxrandr') }}
        - ${{ cdt('alsa-lib') }}
    #    - {{ cdt('xorg-x11-server-xvfb') }}  # [linux]
    - if: not win
      then: make
    - if: win
      then: ninja
  host:
    - python
    - packaging
    - qt
    - libxml2
    - libxslt
    - pip
    - setuptools
    - libclang
  run:
    - python

tests:
  - python:
      imports:
        - PySide2.QtCharts
        - PySide2.QtConcurrent
        - PySide2.QtCore
        - PySide2.QtDataVisualization
        - PySide2.QtGui
        - PySide2.QtHelp
        - PySide2.QtLocation
        - PySide2.QtMultimedia
        - PySide2.QtMultimediaWidgets
        - PySide2.QtNetwork
        - PySide2.QtOpenGL
        - PySide2.QtPositioning
        - PySide2.QtPrintSupport
        - PySide2.QtQml
        - PySide2.QtQuick
        - PySide2.QtQuickWidgets
        - PySide2.QtRemoteObjects
        - PySide2.QtScript
        - PySide2.QtScriptTools
        - PySide2.QtScxml
        - PySide2.QtSensors
        - PySide2.QtSql
        - PySide2.QtSvg
        - PySide2.QtTest
        - PySide2.QtTextToSpeech
        - PySide2.QtUiTools
        - PySide2.QtWebChannel
        - PySide2.QtWebSockets
        - PySide2.QtWidgets
        - PySide2.QtXml
        - PySide2.QtXmlPatterns
        - PySide2.Qt3DAnimation
        - PySide2.Qt3DCore
        - PySide2.Qt3DExtras
        - PySide2.Qt3DInput
        - PySide2.Qt3DLogic
        - PySide2.Qt3DRender
  - requirements:
      run:
        - pip
    script:
      - shiboken2 --help
      - pyside2-lupdate -help
      - pyside2-rcc -help
      - pyside2-uic -help
      - pip show PySide2
      - pip show shiboken2

about:
  license: LGPL-3.0-only
  license_file: LICENSE.LGPLv3
  summary: Python bindings for Qt
  homepage: https://wiki.qt.io/PySide2

extra:
  recipe-maintainers:
    - jan-janssen
    - jschueller

