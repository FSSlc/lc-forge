schema_version: 1

context:
  name: at-spi2-core
  version: "2.58.3"
  version_majmin: "2.58"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://download.gnome.org/sources/${{ name }}/${{ version_majmin }}/${{ name }}-${{ version }}.tar.xz
  sha256: b0fabea6c9742eda8c9c675f9b8c1d1babba1da82da03ea1103710233717c1b0

build:
  number: 0
  skip: not linux

requirements:
  build:
    - gettext
    - meson
    - ninja
    - pkg-config
    - pthread-stubs
    - setuptools < 74 # needed for gobject-introspection, for now
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - dbus
    - glib
    - gobject-introspection
    - libxml2-devel
    - xorg-libx11
    - xorg-libxi
    - xorg-libxtst
    - zlib
  run:
    - xorg-libx11
    - xorg-libxi
    - xorg-libxtst
  run_exports:
    - ${{ pin_subpackage('at-spi2-core', upper_bound='x.x') }}
  ignore_run_exports:
    from_package:
      - zlib

tests:
  - script:
      - test -f $PREFIX/include/at-spi-2.0/atspi/atspi.h
      - test -f $PREFIX/lib/libatspi${SHLIB_EXT}

about:
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: D-Bus-based implementation of AT-SPI accessibility framework
  description: |
    This package includes the protocol definitions for the new D-Bus at-spi.

    Also included is the daemon necessary for forwarding device events and
    registering accessible applicaitions.
  homepage: http://www.gtk.org/
  repository: https://gitlab.gnome.org/GNOME/at-spi2-core

extra:
  recipe-maintainers:
    - ryanvolz
    - stuarteberg
    - tschoonj

