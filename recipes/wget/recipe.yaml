schema_version: 1

context:
  version: 1.25.0

package:
  name: wget
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/wget/wget-${{ version }}.tar.gz
  sha256: 766e48423e79359ea31e41db9e5c289675947a7fcf2efdcedb726ac9d0da3784

build:
  number: 0
  skip: win

requirements:
  build:
    - if: unix
      then: gnuconfig
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - pkg-config
    - make
  host:
    - python
    - openssl
    - libidn2
    - libunistring
    - zlib
    - pcre2
  run:
    - openssl
    - libidn2
    - libunistring
    - zlib
    - pcre2

tests:
  - script:
      - wget --help
      - wget --version
      - wget https://github.com/conda-forge

about:
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: utility for non-interactive download of files from the Web
  description: |
    wget is a free software package for retrieving files using HTTP, HTTPS and FTP,
    the most widely-used Internet protocols.
  homepage: https://www.gnu.org/software/wget/
  documentation: https://www.gnu.org/software/wget/

extra:
  recipe-maintainers:
    - johanneskoester
    - bgruening
