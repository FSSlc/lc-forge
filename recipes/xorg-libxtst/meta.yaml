{% set xorg_name = "libXtst" %}
{% set xorg_category = "lib" %}
{% set name = "xorg-libXtst" %}
{% set version = "1.2.3" %}
{% set sha256 = "4655498a1b8e844e3d6f21f3b2c4e2b571effb5fd83199d428a6ba7ea4bf5204" %}
{% set am_version = "1.15" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # fn: {{ name }}-{{ version }}.tar.bz2
  # url: ../../pkgs/xorg-libXtst-1.2.3.tar.bz2
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.bz2
  sha256: {{ sha256 }}

build:
  number: 1002
  detect_binary_files_with_prefix: true

requirements:
  build:
    - m2-autoconf  # [win]
    - m2-automake{{ am_version }}  # [win]
    - m2-libtool  # [win]
    - m2w64-pkg-config  # [win]
    - pkg-config  # [not win]
    - posix  # [win]
    - gnuconfig  # [unix]
    - {{ compiler('c') }}        # [unix]
    - {{ compiler('m2w64_c') }}  # [win]
    - make   # [unix]
  host:
    - xorg-libx11 >=1.6,<2
    # Additional constraintless xorg-libx11 dep below is for conda-build to add potential pinning to.
    - xorg-libx11
    - xorg-libxext 1.3.*
    - xorg-libxi 1.7.*
    - xorg-xorgproto
    - xorg-util-macros
  run:
    - xorg-libxext 1.3.*
    - xorg-libxi 1.7.*
    - xorg-xorgproto
    - {{ pin_compatible('xorg-libx11') }}

test:
  commands:
    - test -f $PREFIX/lib/libXtst.dylib  # [osx]
    - test -f $PREFIX/lib/libXtst.so  # [linux]
    - if not exist %PREFIX%/Library/lib/libXtst.dll.a exit /b 1  # [win]
    - if not exist %PREFIX%/Library/bin/msys-Xtst-*.dll exit /b 1  # [win]

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: 'The X.org X11 test-event library.'

extra:
  recipe-maintainers:
    - pkgw
