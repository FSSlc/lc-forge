schema_version: 1

context:
  xorg_name: libXtst
  xorg_category: lib
  name: xorg-libXtst
  version: 1.2.3
  sha256: 4655498a1b8e844e3d6f21f3b2c4e2b571effb5fd83199d428a6ba7ea4bf5204
  am_version: 1.15  # keep synchronized with build.sh

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # fn: {{ name }}-{{ version }}.tar.bz2
  # url: ../../pkgs/xorg-libXtst-1.2.3.tar.bz2
  url: https://www.x.org/releases/individual/${{ xorg_category }}/${{ xorg_name }}-${{ version }}.tar.bz2
  sha256: ${{ sha256 }}

build:
  number: 1002
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - if: win
      then: m2-autoconf
    - if: win
      then: m2-automake${{ am_version }}
    - if: win
      then: m2-libtool
    - if: win
      then: m2w64-pkg-config
    - if: not win
      then: pkg-config
    - if: win
      then: posix
    - if: unix
      then: gnuconfig
    - if: unix
      then: ${{ compiler('c') }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: unix
      then: make
  host:
    - xorg-libx11 >=1.6,<2
    # Additional constraintless xorg-libx11 dep below is for conda-build to add potential pinning to.
    - xorg-libx11
    - xorg-libxext 1.3.*
    - xorg-libxi 1.7.*
    - xorg-xorgproto
    - xorg-util-macros
  run:
    - xorg-libxext 1.3.*
    - xorg-libxi 1.7.*
    - xorg-xorgproto
    - ${{ pin_compatible('xorg-libx11') }}

tests:
  - script:
      - if: osx
        then: test -f $PREFIX/lib/libXtst.dylib
      - if: linux
        then: test -f $PREFIX/lib/libXtst.so
      - if: win
        then: if not exist %PREFIX%/Library/lib/libXtst.dll.a exit /b 1
      - if: win
        then: if not exist %PREFIX%/Library/bin/msys-Xtst-*.dll exit /b 1

about:
  license: MIT
  license_file: COPYING
  summary: The X.org X11 test-event library.
  homepage: https://www.x.org/

extra:
  recipe-maintainers:
    - pkgw

