schema_version: 1

context:
  xorg_name: libXcursor
  xorg_category: lib
  name: xorg-libXcursor
  version: "1.2.3"
  sha256: fde9402dd4cfe79da71e2d96bb980afc5e6ff4f8a7d74c159e1966afb2b2c2c0
  am_version: "1.16"  # keep synchronized with build.sh

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://www.x.org/releases/individual/${{ xorg_category }}/${{ xorg_name }}-${{ version }}.tar.xz
  sha256: ${{ sha256 }}

build:
  number: 0

requirements:
  build:
    - if: win
      then: m2-autoconf
    - if: win
      then: m2-automake${{ am_version }}
    - if: win
      then: m2-libtool
    - if: unix
      then: pkg-config
    - if: win
      then: m2-pkg-config
    - if: unix
      then: gnuconfig
    - if: win
      then: m2-base
    - if: unix
      then: make
    - if: win
      then: m2-make
    - if: unix
      then: ${{ compiler("c") }}
    - if: unix
      then: ${{ stdlib("c") }}
    - if: win
      then: ${{ compiler("m2w64_c") }}
    - if: win
      then: ${{ stdlib("m2w64_c") }}
  host:
    - pthread-stubs
    - xorg-libx11 >=1.6,<2
    # Additional constraintless xorg-libx11 dep below is for conda-build to add potential pinning to.
    - xorg-libx11
    - xorg-libxfixes
    - xorg-libxrender 0.9.*
    - xorg-util-macros
  run:
    - ${{ pin_compatible('xorg-libx11') }}
  run_exports:
    - ${{ pin_subpackage(name|lower) }}

tests:
  - script:
      - if: osx
        then: test -f $PREFIX/lib/libXcursor.dylib
      - if: linux
        then: test -f $PREFIX/lib/libXcursor.so
      - if: win
        then: if not exist %PREFIX%/Library/lib/libXcursor.dll.a exit /b 1
      - if: win
        then: if not exist %PREFIX%/Library/bin/msys-Xcursor-*.dll exit /b 1

about:
  license: MIT
  license_file: COPYING
  summary: The X.org mouse cursor control library.
  homepage: https://www.x.org/

extra:
  recipe-maintainers:
    - pkgw

