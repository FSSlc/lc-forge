{% set xorg_name = "xorgproto" %}
{% set xorg_category = "proto" %}
{% set name = "xorg-xorgproto" %}
{% set version = "2025.1" %}
{% set sha256 = "56898c716c0578df8a2d828c9c3e5c528277705c0484381a81960fe1a67668e8" %}
{% set am_version = "1.15" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.xz
  sha256: {{ sha256 }}
  patches:
    - 0001-windows-fds-bits.patch  # [win]

build:
  number: 0

requirements:
  build:
    - m2-autoconf  # [win]
    - m2-automake{{ am_version }}  # [win]
    - m2-libtool  # [win]
    - m2-pkg-config  # [win]
    - m2-base  # [win]
    - m2-make  # [win]
    - {{ compiler('m2w64_c') }}  # [win]
    - {{ stdlib("m2w64_c") }}    # [win]

    - pkg-config  # [unix]
    - gnuconfig  # [unix]
    - make  # [unix]
    - gnuconfig  # [unix]
    - {{ compiler('c') }}        # [unix]
    - {{ stdlib("c") }}          # [unix]
  host:
    - xorg-util-macros
    - python {{ python_min }}

test:
  commands:
    - test -e $PREFIX/include/X11/extensions/damageproto.h  # [not win]

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: licenses/
  summary: X.org protocol headers

extra:
  recipe-maintainers:
    - pkgw
