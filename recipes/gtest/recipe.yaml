schema_version: 1

context:
  version: "1.17.0"

recipe:
  name: gtest-split
  version: ${{ version }}

source:
  url: https://github.com/google/googletest/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c

build:
  number: 1

outputs:
  - package:
      name: gtest
      version: ${{ version }}
    build:
      script:
        - if: unix
          then: source ${RECIPE_DIR}/build-gtest.sh
        - if: win
          then: ${{ RECIPE_DIR }}\build-gtest.bat
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
      run_exports:
        - ${{ pin_subpackage('gtest', upper_bound='x.x.x') }}
      run_constraints:
        - gmock 1.17.0.*
    tests:
      - requirements:
          run:
            - pkg-config
        script:
          - if: unix
            then: test -f $PREFIX/lib/libgtest${SHLIB_EXT}
          - if: win
            then: if not exist %LIBRARY_BIN%\\gtest.dll exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\\gtest.lib exit 1
          - if: unix
            then: test ! -f $PREFIX/lib/libgtest.a
          - pkg-config --print-errors --exact-version "${{ version }}" gtest

          - if: unix
            then: test -f $PREFIX/lib/libgmock${SHLIB_EXT}
          - if: win
            then: if not exist %LIBRARY_BIN%\\gmock.dll exit 1
          - if: win
            then: if not exist %LIBRARY_LIB%\\gmock.lib exit 1
          - if: unix
            then: test ! -f $PREFIX/lib/libgmock.a
          - pkg-config --print-errors --exact-version "${{ version }}" gmock

          - if: unix
            then: test -f $PREFIX/include/gtest/gtest.h || (echo "gtest/gtest.h not found" && exit 1)
          - if: win
            then: if not exist %LIBRARY_INC%\gtest\\gtest.h exit 1

          - if: unix
            then: test -f $PREFIX/include/gmock/gmock.h || (echo "gmock/gmock.h not found" && exit 1)
          - if: win
            then: if not exist %LIBRARY_INC%\gmock\\gmock.h exit 1

  # empty wrapper for compatibility with previous output naming/separation
  - package:
      name: gmock
      version: ${{ version }}
    requirements:
      host:
        - ${{ pin_subpackage('gtest', exact=True) }}
      run:
        - ${{ pin_subpackage('gtest', exact=True) }}
    tests:
      - script:
          - echo "Tested above"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Google's C++ test framework
  homepage: https://github.com/google/googletest

extra:
  recipe-maintainers:
    - SylvainCorlay
    - scopatz
    - wesm
    - marcelotrevisani
    - xhochy
    - h-vetinari
  feedstock-name: gtest

