schema_version: 1

context:
  version: "5.4.4"

package:
  name: lua
  version: ${{ version }}

source:
  - url: http://www.lua.org/ftp/lua-${{ version }}.tar.gz
    sha256: 164c7849653b80ae67bec4b7473b884bf5cc8d2dca05653475ec2ed27b9ebf61
    patches:
      # Enables Lua to look for packages on a relative path
      - luaconf.patch
      # Build as a shared library
      - liblua.so.patch
      # Enables readline on linux
      - Makefile.patch
  - path: CMakeLists.txt

build:
  number: 0
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - if: not win
      then: ${{ compiler('c') }}
    - if: win64
      then: vs2017_win-64
    - if: win32
      then: vs2017_win-32
    - if: win
      then: ninja
    - if: win
      then: cmake
    - if: unix
      then: sed
    - if: unix
      then: make
  host:
    - if: not win
      then: readline
    - if: not win
      then: ncurses
  run:
    - if: not win
      then: readline
    - if: not win
      then: ncurses
  run_exports:
    - ${{ pin_subpackage('lua', upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/lib/liblua$SHLIB_EXT
      - if: win
        then: if not exist %LIBRARY_INC%\\lua.h exit 1
      - if: win
        then: if not exist %LIBRARY_BIN%\\lua.dll exit 1
      - if: win
        then: if not exist %LIBRARY_BIN%\\lua.exe exit 1
      - if: win
        then: if not exist %LIBRARY_BIN%\\lua.exe exit 1
      - lua -v
      - lua -e "print(package.path)"

about:
  summary: Lua is a powerful, fast, lightweight, embeddable scripting language
  license: MIT
  license_file: doc/readme.html
  homepage: http://www.lua.org/

extra:
  recipe-maintainers:
    - alexbw
    - seanyen
    - izahn
