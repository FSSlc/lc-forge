context:
  version: 1.3.1
  build_number: '0'

package:
  name: pycotap
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/p/pycotap/pycotap-${{ version }}.tar.gz
  sha256: 674355f01300be03df7f871784e498652c2d89ac19cd77ee8e61652634a2f83a

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - 'python '
  - pip
  run:
  - 'python '

tests:
- python:
    imports:
    - pycotap
    pip_check: true

about:
  homepage: https://github.com/remko/pycotap
  summary: A tiny test runner that outputs TAP results to standard output.
  description: "pycotap is a simple Python test runner for unittest that outputs Test Anything Protocol results directly to standard output."
  license: MIT
  license_file:
    - COPYING
