schema_version: 1

context:
  version: "3.12.0"
  python_min: "3.10"

package:
  name: flit-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flit/flit-${{ version }}.tar.gz
  sha256: 1c80f34dd96992e7758b40423d2809f48f640ca285d0b7821825e50745ec3740
  target_directory: source

build:
  number: 2
  noarch: python
  script: python -m pip install --no-deps -vv source/flit_core/

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
  run_constraints:
    - flit ${{ version }}.*

tests:
  - python:
      imports:
        - flit_core
        - flit_core.common
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: source/LICENSE
  summary: Simplified packaging of Python modules
  homepage: https://flit.readthedocs.io/

extra:
  recipe-maintainers:
    - takluyver
    - beckermr
