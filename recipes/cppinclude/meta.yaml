{% set version = "0.5.0" %}

package:
  name: cppinclude
  version: {{ version }}

source:
  # url: ../../pkgs/cppinclude-{{ version }}.tar.gz
  url: https://github.com/cppinclude/cppinclude/archive/refs/tags/v{{ version }}.tar.gz
  fn: cppinclude-{{ version }}.tar.gz
  sha256: 31c36a347b43ee667c6f17121c2d0fb7cf4d2672130f25273a48835b21f6ae40
  patches:
    - 01_std_hash.patch

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake     # [unix]
    - make      # [unix]
  host:

test:
  commands:
    - test -f ${PREFIX}/bin/cppinclude       # [not win]
    - test -f ${PREFIX}/include/re2/re2.h    # [not win]
    - test -f ${PREFIX}/lib/libre2.a         # [not win]

about:
  home: https://github.com/cppinclude/cppinclude
  license: MIT
  license_file: LICENSE
  summary: Tool for analyzing includes in C++.
  description: |
    Tool for analyzing includes in C++. 
    One of the problems in C++ is that if a header file was changed all files that include that file will be recompiled and sometime it takes a lot of time.
  doc_url: https://github.com/cppinclude/cppinclude

extra:
  recipe-maintainers:
    - fsslc
