schema_version: 1

context:
  name: doctest
  version: "2.5.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/onqtam/doctest/archive/v${{ version }}.zip
    sha256: 5ddeafa34bece65b9f2e5207186fa70cd8ca44c00f41ae2c25e6e50b427c2b79

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake >=3.1
    - ninja
    - ${{ stdlib('c') }}

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/include/doctest/doctest.h
      - if: unix
        then: test -f $PREFIX/lib/cmake/doctest/doctestConfig.cmake
      - if: win
        then: if not exist %LIBRARY_PREFIX%\\include\\doctest\\doctest.h exit 1
      - if: win
        then: if not exist %LIBRARY_PREFIX%\\lib\\cmake\\doctest\\doctestConfig.cmake exit 1

about:
  license: MIT
  license_file: LICENSE.txt
  summary: The fastest feature-rich C++11/14/17/20 single-header testing framework for unit tests and TDD
  description: |
    doctest is a new C++ testing framework but is by far
    the fastest both in compile times (by orders of magnitude) and
    runtime compared to other feature-rich alternatives.
    It brings the ability of compiled languages such as D / Rust / Nim to
    have tests written directly in the production code thanks to a fast,
    transparent and flexible test runner with a clean interface.
  homepage: https://github.com/onqtam/doctest
  repository: https://github.com/onqtam/doctest
  documentation: https://github.com/onqtam/doctest/blob/master/doc/markdown/readme.md#reference

extra:
  recipe-maintainers:
    - elbaro

