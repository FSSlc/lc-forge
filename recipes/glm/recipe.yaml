schema_version: 1

context:
  name: GLM
  version: 1.0.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/g-truc/glm/archive/refs/tags/${{ version }}.tar.gz
  sha256: 9f3174561fd26904b23f0db5e560971cbf9b3cbda0b280f04d5c379d03bf234c
  patches:
    - patches/macos_test_errors.patch

build:
  number: 0
  skip: win and vc<14

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: unix
      then: make

tests:
  - requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    script:
      - if: unix
        then: test -r "${PREFIX}/include/glm"
      - if: win
        then: if not exist %LIBRARY_INC%\glm exit 1
      - cmake-package-check glm --targets glm::glm

about:
  license: MIT
  license_file: manual.md
  summary: OpenGL Mathematics
  homepage: https://glm.g-truc.net
  repository: https://github.com/g-truc/glm

extra:
  recipe-maintainers:
    - traversaro
