schema_version: 1

context:
  name: iniconfig
  version: "2.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c76315c77db068650d49c5b56314774a7804df16fee4402c1f19d6d15d8c4730

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatch-vcs
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - iniconfig
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: "iniconfig: brain-dead simple config-ini parsing"
  license: MIT
  license_file: LICENSE
  homepage: http://github.com/RonnyPfannschmidt/iniconfig

extra:
  recipe-maintainers:
    - nicoddemus

