schema_version: 1

context:
  name: flit-scm
  version: "1.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flit_scm-${{ version }}.tar.gz
  sha256: 961bd6fb24f31bba75333c234145fff88e6de0a90fc0f7e5e7c79deca69f6bb2

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.5.0,<4
    - pip
    - setuptools_scm >=6.4
    - tomli
  run:
    - python >=${{ python_min }}
    - flit-core >=3.5.0,<4
    - setuptools_scm >=6.4
    - tomli

tests:
  - python:
      imports:
        - flit_scm
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: |
    A PEP 518 build backend that uses setuptools_scm to generate a version file
    from your version control system, then flit_core to build the package.
  license: MIT
  license_file: LICENSE
  homepage: https://gitlab.com/WillDaSilva/flit_scm
  repository: https://gitlab.com/WillDaSilva/flit_scm
  documentation: https://gitlab.com/WillDaSilva/flit_scm

extra:
  recipe-maintainers:
    - xylar
    - WillDaSilva

