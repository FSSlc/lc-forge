schema_version: 1

context:
  version: "3.30.0"

package:
  name: freerdp
  version: ${{ version }}

source:
  url: https://github.com/FreeRDP/FreeRDP/releases/download/${{ version }}/freerdp-${{ version }}.tar.gz
  sha256: e2687d02dea6fede004d36391dac1a74ce57a210f8867fd95033171d4909590c

build:
  number: 0
  skip: [win, osx]
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
    - if: linux
      then:
        - ${{ cdt('libx11-devel') }}
        - ${{ cdt('libxext-devel') }}
        - ${{ cdt('libxrender-devel') }}
        - ${{ cdt('xorg-x11-proto-devel') }}
        - ${{ cdt('mesa-libgl-devel') }}
  host:
    - openssl
    - zlib
    - icu
    - alsa-lib
    - pulseaudio
    - krb5
    - xorg-libx11
    - xorg-libxext
    - xorg-libxrender
    - xorg-libxfixes
    - xorg-libxi
    - xorg-libxinerama
    - xorg-libxdamage
    - xorg-libxv
    - xorg-libxrandr
    - xorg-libxcursor
    - xorg-libxtst
    - libxkbfile
    - wayland
    - libxkbcommon
    - sdl2
    - libjpeg-turbo
  run:
    - xorg-libx11
    - xorg-libxext
    - xorg-libxrender
    - xorg-libxfixes
    - xorg-libxi
    - xorg-libxdamage
    - xorg-libxrandr
    - xorg-libxtst
    - libxkbfile
  run_exports:
    - ${{ pin_subpackage('freerdp', upper_bound='x') }}

tests:
  - script:
      - xfreerdp --version 2>&1 | grep -q "3.30.0"

about:
  homepage: https://www.freerdp.com/
  license: Apache-2.0
  license_file: LICENSE
  summary: Free Remote Desktop Protocol client and server
  description: |
    FreeRDP is a free implementation of the Remote Desktop Protocol (RDP)
    released under the Apache license. It provides a client and server
    for remote desktop access.
  repository: https://github.com/FreeRDP/FreeRDP

extra:
  recipe-maintainers:
    - FSSlc
