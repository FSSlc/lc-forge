#
# Conda recipe for OpenBox
#

{% set name = "openbox" %}
{% set version = "3.6.1" %}
{% set sha256 = "abe75855cc5616554ffd47134ad15291fe37ebbebf1a80b69cbde9d670f0e26d" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # - url: ../../pkgs/{{ name }}-{{ version }}.tar.xz
  - url: http://openbox.org/dist/openbox/openbox-{{ version }}.tar.xz
    sha256: {{ sha256 }}
  - path: ./menu.xml
  - path: ./setlayout.c
  - path: ./terminals.menu
  - path: ./xdg-menu  

build:
  number: 0
  detect_binary_files_with_prefix: False

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
    - libtool
    - automake
    - gettext
    - pyxdg
    - pkg-config
    - xorg-libxft
    - freetype <3.0a0
    - zlib <1.3.0a0
    - pcre
    - fribidi
    - harfbuzz
    - {{ cdt('pango-devel') }}      # [linux]
    - {{ cdt('libxml2-devel') }}     # [linux]  
    - {{ cdt('libxcursor-devel') }}     # [linux]  
    - {{ cdt('libxt-devel') }}  # [linux]  
    - {{ cdt('libxrandr-devel') }} # [linux]
    - {{ cdt('libxinerama-devel') }} # [linux]
    - {{ cdt('glib2-devel') }} # [linux]

  host:
    - pyxdg
    - pkg-config
    - xorg-libxft
    - freetype <3.0a0
    - zlib <1.3.0a0
    - libgcc-ng >=11
    - pcre
    - fribidi
    - harfbuzz
    - {{ cdt('pango-devel') }}      # [linux]
    - {{ cdt('libxml2-devel') }}     # [linux]  
    - {{ cdt('libxcursor-devel') }}     # [linux]  
    - {{ cdt('libxt-devel') }}  # [linux]  
    - {{ cdt('libxrandr-devel') }} # [linux]
    - {{ cdt('libxinerama-devel') }} # [linux]
    - {{ cdt('glib2-devel') }} # [linux]

  run:
    - pyxdg
    - python >=3
    - pkg-config
    - xorg-libxft
    - zlib
    - pcre
    - fribidi
    - harfbuzz
    - {{ cdt('pango-devel') }}      # [linux]
    - {{ cdt('libxml2-devel') }}     # [linux]  
    - {{ cdt('libxcursor-devel') }}     # [linux]  
    - {{ cdt('libxt-devel') }}  # [linux]  
    - {{ cdt('libxrandr-devel') }} # [linux]
    - {{ cdt('libxinerama-devel') }} # [linux]
    - {{ cdt('glib2-devel') }} # [linux]

about:
  home: http://openbox.org
  summary: Openbox is a highly configurable, next generation window manager with extensive standards support. 
  license: GPL-2.0-only
  license_file: COPYING
