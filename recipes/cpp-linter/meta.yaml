{% set name = "cpp-linter" %}
{% set version = "1.12.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/f5/fe/ca018b0ea8e5d878d9ddfad2abfbafcb674fbccd02d2745fec8a1e6d1c4e/cpp_linter-{{ version }}.tar.gz 
  sha256: 2d7f22acda0d3e0a17244980adf6920c9c6353a406b921fce7409d930e5c63aa

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.9
    - pygit2
    - requests

test:
  imports:
    - cpp_linter
  commands:
    - cpp-linter -h

about:
  home: https://github.com/cpp-linter/cpp-linter
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: C/C++ linting orchestration with clang-tidy and clang-format
  description: |
    cpp-linter runs clang-format and clang-tidy across a codebase and reports
    findings in a structure usable for GitHub pull-request comments and
    annotations.
  doc_url: https://cpp-linter.github.io/cpp-linter
  dev_url: https://github.com/cpp-linter/cpp-linter

extra:
  recipe-maintainers:
    - fsslc
