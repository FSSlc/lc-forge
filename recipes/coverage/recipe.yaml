schema_version: 1

context:
  version: "7.13.5"

package:
  name: coverage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coverage/coverage-${{ version }}.tar.gz
  sha256: c81f6515c4c40141f83f502b07bbfa5c240ba25bbe73da7b33f1e5b6120ff179

build:
  number: 0
  noarch: ${{ 'python' if use_noarch else '' }}
  python:
    entry_points:
      - coverage = coverage.cmdline:main
  # track_features:
  #   - if: use_noarch
  #     then: coverage_no_compile

requirements:
  build:
    - if: build_platform != target_platform and not use_noarch
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - if: not use_noarch
      then: python
    - if: use_noarch
      then: python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - if: not use_noarch
      then: python
    - if: use_noarch
      then: python >=${{ python_min }}
    # extra dependency
    - tomli

tests:
  - python:
      imports:
        - coverage
  - requirements:
      run:
        - pip
        - if: use_noarch
          then: python ${{ python_min }}.*
    script:
      - pip check
      - coverage --help

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Code coverage measurement for Python
  homepage: https://coverage.readthedocs.io

extra:
  recipe-maintainers:
    - thewchan
    - ericmjl
    - jakirkham
    - ocefpaf

