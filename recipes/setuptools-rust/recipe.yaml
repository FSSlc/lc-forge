schema_version: 1

context:
  version: "1.12.0"

package:
  name: setuptools-rust
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/setuptools-rust/setuptools_rust-${{ version }}.tar.gz
  sha256: d94a93f0c97751c17014565f07bdc324bee45d396cd1bba83d8e7af92b945f0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=62.4
  run:
    - python >=${{ python_min }}
    - semantic_version >=2.8.2,<3
    - setuptools >=62.4

tests:
  - python:
      imports:
        - setuptools_rust
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  license: MIT
  license_file: LICENSE
  summary: Setuptools rust extension plugin
  homepage: https://github.com/PyO3/setuptools-rust

extra:
  recipe-maintainers:
    - davidhewitt
    - nicoddemus

