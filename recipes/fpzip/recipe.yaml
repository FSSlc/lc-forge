context:
  version: 1.3.0

package:
  name: fpzip
  version: ${{ version }}

source:
  url: https://github.com/LLNL/fpzip/releases/download/${{ version }}/fpzip-${{ version }}.tar.gz
  # path: ../../pkgs/fpzip-${{ version }}.tar.gz
  sha256: 248df7d84259e3feaa4c4797956b2a77c3fcd734e8f8fdc51ce171dcf4f0136c

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake
    - make

about:
  homepage: http://fpzip.llnl.gov
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Compressed Large Multidimensional Floating-Point Arrays.
  documentation: http://fpzip.llnl.gov
  description: |
    fpzip is a BSD-licensed open-source library for lossless or lossy compression of large multidimensional floating-point arrays.

extra:
  recipe-maintainers:
    - fsslc
