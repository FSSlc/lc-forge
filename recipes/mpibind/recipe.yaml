context:
  name: mpibind
  version: "0.23.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/llnl/mpibind/archive/refs/tags/v${{ version }}.tar.gz
  sha256: eb6314cf814b995c446a43da93b642188c08e270ab2e26abb7482920df6d7d39

build:
  number: 0
  skip: [win]
  script:
    - git config --global --add safe.directory '*'
    - ./bootstrap
    - ./configure --prefix=$PREFIX
    - make -j$CPU_COUNT
    - make -j$CPU_COUNT install

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - git
    - make
    - autoconf
    - automake
    - libtool
    - pkg-config
  host:
    - hwloc
    - python

about:
  homepage: https://github.com/llnl/mpibind
  repository: https://github.com/llnl/mpibind
  license: MIT
  license_file:
    - LICENSE
  summary: Pragmatic, Productive, and Portable Affinity for HPC.

extra:
  recipe-maintainers:
    - fsslc
