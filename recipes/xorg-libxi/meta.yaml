{% set xorg_name = "libXi" %}
{% set xorg_category = "lib" %}
{% set name = "xorg-libXi" %}
{% set version = "1.7.10" %}
{% set sha256 = "36a30d8f6383a72e7ce060298b4b181fd298bc3a135c8e201b7ca847f5f81061" %}
{% set am_version = "1.15" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # fn: {{ name }}-{{ version }}.tar.bz2
  # url: ../../pkgs/xorg-libXi-1.7.10.tar.bz2
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.bz2

  sha256: {{ sha256 }}

build:
  number: 0
  detect_binary_files_with_prefix: true

requirements:
  build:
    - m2-autoconf  # [win]
    - m2-automake{{ am_version }}  # [win]
    - m2-libtool  # [win]
    - m2w64-pkg-config  # [win]
    - pkg-config  # [not win]
    - posix  # [win]
    - {{ compiler('c') }}        # [unix]
    - {{ compiler('m2w64_c') }}  # [win]
    - make                          # [unix]
    - autoconf                      # [unix]
    - automake                      # [unix]
    - gettext                       # [unix]
    - libtool                       # [unix]
  host:
    - pthread-stubs
    - xorg-xorgproto
    - xorg-libx11 1.7.*
    - xorg-libxext 1.3.*
    - xorg-libxfixes 5.0.*
    - xorg-util-macros
  run:
    - xorg-xorgproto
    - xorg-libx11 1.7.*
    - xorg-libxext 1.3.*
    - xorg-libxfixes 5.0.*

test:
  commands:
    - test -f $PREFIX/lib/libXi.dylib  # [osx]
    - test -f $PREFIX/lib/libXi.so  # [linux]
    - if not exist %PREFIX%/Library/lib/libXi.dll.a exit /b 1  # [win]
    - if not exist %PREFIX%/Library/bin/msys-Xi-*.dll exit /b 1  # [win]
    - conda inspect linkages -p $PREFIX $PKG_NAME  # [not win]
    - conda inspect objects -p $PREFIX $PKG_NAME  # [osx]

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: 'The X.org input library.'

extra:
  recipe-maintainers:
    - pkgw
