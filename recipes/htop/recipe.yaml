schema_version: 1

context:
  name: htop
  version: 3.4.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/htop-dev/htop/archive/${{ version }}/${{ name }}-${{ version }}.tar.gz
  sha256: af9ec878f831b7c27d33e775c668ec79d569aa781861c995a0fbadc1bdb666cf

build:
  number: 0
  skip: win

requirements:
  build:
    - automake
    - libtool
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - make
    - pkg-config
  host:
    - ncurses
    - if: linux
      then: libnl
  run:
    - ncurses
  run_constraints:

tests:
  - script:
      - htop --version

about:
  license: GPL-2.0-only
  license_file: COPYING
  summary: htop is an interactive text-mode process viewer for Unix systems. It aims to be a better 'top'
  homepage: https://htop.dev/
  repository: https://github.com/htop-dev/htop/

extra:
  recipe-maintainers:
    - chrisburr
    - keuv-grvl
