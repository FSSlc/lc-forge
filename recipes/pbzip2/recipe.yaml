schema_version: 1

context:
  version: "1.1.13"
  major_version: "1.1"
  md5: 4cb87da2dba05540afce162f34b3a9a6

package:
  name: pbzip2
  version: ${{ version }}

source:
  url: https://launchpad.net/pbzip2/${{ major_version }}/${{ version }}/+download/pbzip2-${{ version }}.tar.gz
  md5: ${{ md5 }}

build:
  number: 2
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - make
  host:
    - bzip2
  run:
    - bzip2

tests:
  - script:
      - pbzip2 --version

about:
  license: LicenseRef-pbzip2
  license_file: COPYING
  summary: PBZIP2 is a parallel implementation of the bzip2 block-sorting file compressor
  homepage: http://compression.ca/pbzip2/

extra:
  recipe-maintainers:
    - shahin
    - marcelm

