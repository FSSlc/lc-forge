schema_version: 1

context:
  name: libksba
  version: "1.6.7"
  sha256: cf72510b8ebb4eb6693eef765749d83677a03c79291a311040a5bfd79baab763

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://www.gnupg.org/ftp/gcrypt/${{ name }}/${{ name }}-${{ version }}.tar.bz2
  sha256: ${{ sha256 }}

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: unix
      then: gnuconfig
    - if: unix
      then: make
  host:
    - libgpg-error
  run_exports:
    - ${{ pin_subpackage('libksba', upper_bound='x.x') }}

about:
  summary: Libksba is a library to make the tasks of working with X.509 certificates
  license: LGPL-3.0-or-later
  license_file: COPYING
  description: |
    Libksba is a library to make the tasks of working with X.509 certificates,
    CMS data and related objects more easy. It provides a highlevel interface to
    the implemented protocols and presents the data in a consistent way.


  homepage: https://www.gnupg.org/software/libksba/index.html

extra:
  recipe-maintainers:
    - mariusvniekerk
    - zklaus

