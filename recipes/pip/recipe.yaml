schema_version: 1

context:
  version: "26.0.1"

package:
  name: pip
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pip/pip-${{ version }}.tar.gz
  sha256: c4037d8a277c89b320abe636d59f91e6d0922d08a05b60e85e53b296613346d8

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pip = pip._internal.cli.main:main
      - pip3 = pip._internal.cli.main:main

requirements:
  host:
    - if: not with_setuptools_wheel
      then: python >=3.13.0a0
    - if: with_setuptools_wheel
      then: python >=${{ python_min }},<3.13.0a0
    - flit-core
    - setuptools
    - wheel
  run:
    - if: not with_setuptools_wheel
      then: python >=3.13.0a0
    - if: with_setuptools_wheel
      then: python >=${{ python_min }},<3.13.0a0
    - if: with_setuptools_wheel
      then: setuptools
    - if: with_setuptools_wheel
      then: wheel

tests:
  - python:
      imports:
        - pip
  - requirements:
      run:
        - if: with_setuptools_wheel
          then: python ${{ python_min }}.*
        - if: not with_setuptools_wheel
          then: python 3.13.0.*
    script:
      - pip -h
      - pip list

about:
  license: MIT
  license_file: LICENSE.txt
  summary: PyPA recommended tool for installing Python packages
  homepage: https://pip.pypa.io/en/stable/
  repository: https://github.com/pypa/pip
  documentation: https://pip.pypa.io/en/stable/

extra:
  recipe-maintainers:
    - jakirkham
    - msarahan
    - pelson
    - ocefpaf
    - mingwandroid

