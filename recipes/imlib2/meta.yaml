{% set name = "imlib2" %}
{% set version = "1.6.1" %}
{% set sha256 = "4d393a77e13da883c8ee2da3b029da3570210fe37d000c9ac33d9fce751b166d" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  # url: ../../pkgs/imlib2-{{ version }}.tar.bz2
  url: https://downloads.sourceforge.net/project/enlightenment/imlib2-src/{{ version }}/imlib2-{{ version }}.tar.bz2
  sha256: {{ sha256 }}

build:
  number: 1

requirements:
  build:
    - {{ compiler('c') }}
    - pkg-config # [osx]
    - make
  host:
    - jpeg
    - libpng
    - freetype <3.0a0
    - zlib
    - bzip2
    - libtiff
    - xz 5.2.*
    - libgcc-ng >=11
    - giflib
    - libwebp
    - xorg-libx11
    - xorg-libxext
  run:
    - jpeg
    - libpng
    - freetype <3.0a0
    - zlib
    - bzip2
    - libtiff
    - giflib
    - libwebp
    - xorg-libx11
    - xorg-libxext

test:
  commands:
    - imlib2-config --version

about:
  home: https://docs.enlightenment.org/api/imlib2/html/index.html
  license: Custom OSS
  license_family: OTHER
  license_file: COPYING
  summary: "Imlib 2 is the successor to Imlib. It is NOT a newer version - it is a completely new library."
