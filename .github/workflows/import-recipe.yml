name: Import recipe from conda-forge

# Manually import a package (and missing deps) from conda-forge into todo/,
# convert to recipe.yaml, build inside the pixi container for linux-64 and
# linux-aarch64, then upload artifacts to https://prefix.dev/scns.
#
# Logic lives in scripts/import_recipe.py — this workflow only wires inputs,
# matrix targets, secrets, and artifacts.

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Package name (conda-forge output or feedstock), e.g. flatbuffers'
        required: true
        type: string
      prepare_only:
        description: 'Only resolve/prep recipes into todo/ (skip build & upload)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Prepare/build even if the package already exists on scns'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DEFAULT_CHANNEL: https://prefix.dev/scns

jobs:
  # -------------------------------------------------------------------------
  # 1. Validate input, recursively prep recipes + missing deps into todo/
  # -------------------------------------------------------------------------
  prepare:
    name: Resolve & prepare
    runs-on: ubuntu-22.04
    outputs:
      recipe: ${{ steps.normalize.outputs.recipe }}
      feedstocks: ${{ steps.import.outputs.feedstocks }}
      already_on_scns: ${{ steps.import.outputs.already_on_scns }}
      should_build: ${{ steps.import.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: normalize
        name: Normalize package name
        shell: bash
        env:
          RECIPE_INPUT: ${{ inputs.recipe }}
        run: |
          set -Eeuo pipefail

          recipe="$RECIPE_INPUT"
          recipe="${recipe#"${recipe%%[![:space:]]*}"}"
          recipe="${recipe%"${recipe##*[![:space:]]}"}"

          if [[ -z "$recipe" || ! "$recipe" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid package name: '${RECIPE_INPUT}'" >&2
            echo "Allowed characters: letters, numbers, dots, underscores, hyphens." >&2
            exit 1
          fi

          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
          echo "Importing package: $recipe"

      - name: Install pixi tools (conda, crm, rattler-build)
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/setup_pixi.sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pixi/bin:$PATH"
          command -v conda
          command -v crm
          command -v rattler-build
          python3 --version

      - id: import
        name: Resolve deps and prep recipes
        shell: bash
        env:
          RECIPE: ${{ steps.normalize.outputs.recipe }}
          # workflow_dispatch booleans arrive as the strings 'true'/'false'
          FORCE: ${{ inputs.force }}
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.pixi/bin:$PATH"

          # Clear any stale status/manifest from a previous local run in the
          # workspace (should not exist on a fresh checkout, but be safe).
          rm -f todo/import-manifest.json todo/.import-manifest.json todo/import-status.json

          force_args=()
          if [[ "${FORCE}" == "true" ]]; then
            force_args+=(--force)
          fi

          set +e
          python3 scripts/import_recipe.py "$RECIPE" --prepare-only "${force_args[@]}"
          rc=$?
          set -e

          if [[ $rc -ne 0 ]]; then
            echo "::error::import_recipe.py failed while preparing '$RECIPE' (exit $rc). See log above for the concrete reason."
            exit "$rc"
          fi

          status="todo/import-status.json"
          manifest="todo/import-manifest.json"
          if [[ ! -f "$manifest" && -f "todo/.import-manifest.json" ]]; then
            mv "todo/.import-manifest.json" "$manifest"
          fi

          # Prefer the explicit status file written by import_recipe.py on every
          # successful exit path (including "already on scns").
          already=false
          should_build=false
          feedstocks=""

          if [[ -f "$status" ]]; then
            echo "--- import-status.json ---"
            cat "$status"
            already=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("already_on_scns", False)).lower())' "$status")
            should_build=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("should_build", False)).lower())' "$status")
            feedstocks=$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1])).get("feedstocks") or []))' "$status")
          elif [[ -f "$manifest" ]]; then
            echo "--- import-manifest.json (no status file; infer should_build) ---"
            cat "$manifest"
            already=false
            should_build=true
            feedstocks=$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1])).get("feedstocks") or []))' "$manifest")
          else
            # No status and no manifest → treat as already present / nothing to do.
            already=true
            should_build=false
            feedstocks=""
          fi

          # If we claim we should build, a non-empty feedstock list is required.
          if [[ "$should_build" == "true" && -z "$feedstocks" && -f "$manifest" ]]; then
            feedstocks=$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1])).get("feedstocks") or []))' "$manifest")
          fi
          if [[ "$should_build" == "true" && -z "$feedstocks" ]]; then
            echo "::error::should_build=true but feedstock list is empty for '$RECIPE'" >&2
            ls -la todo/ >&2 || true
            exit 1
          fi
          if [[ "$should_build" == "true" && ! -f "$manifest" ]]; then
            echo "::error::should_build=true but todo/import-manifest.json is missing" >&2
            exit 1
          fi

          echo "already_on_scns=$already" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "feedstocks=$feedstocks" >> "$GITHUB_OUTPUT"
          echo "Decision: already_on_scns=$already should_build=$should_build feedstocks=$feedstocks"

          {
            echo "## Import decision"
            echo
            echo "- Package: \`$RECIPE\`"
            echo "- already_on_scns: \`$already\`"
            echo "- should_build: \`$should_build\`"
            echo "- feedstocks: \`$feedstocks\`"
            if [[ -f "$manifest" ]]; then
              echo
              echo "### Manifest"
              echo
              echo '```json'
              cat "$manifest"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifact payload
        if: steps.import.outputs.should_build == 'true'
        shell: bash
        env:
          FEEDSTOCKS: ${{ steps.import.outputs.feedstocks }}
        run: |
          set -Eeuo pipefail

          # Build a clean staging dir with only the prepared recipes + manifest.
          # Avoid uploading the entire pre-existing todo/ tree from the repo.
          rm -rf .import-artifact
          mkdir -p .import-artifact/todo

          if [[ ! -f todo/import-manifest.json ]]; then
            echo "Error: todo/import-manifest.json missing before artifact upload" >&2
            ls -la todo/ >&2 || true
            exit 1
          fi
          cp -a todo/import-manifest.json .import-artifact/todo/import-manifest.json
          if [[ -f todo/import-status.json ]]; then
            cp -a todo/import-status.json .import-artifact/todo/import-status.json
          fi

          IFS=',' read -ra FS_LIST <<< "$FEEDSTOCKS"
          for fs in "${FS_LIST[@]}"; do
            fs="${fs#"${fs%%[![:space:]]*}"}"
            fs="${fs%"${fs##*[![:space:]]}"}"
            [[ -z "$fs" ]] && continue
            if [[ ! -d "todo/$fs" ]]; then
              echo "Error: prepared feedstock dir missing: todo/$fs" >&2
              exit 1
            fi
            if [[ ! -f "todo/$fs/recipe.yaml" ]]; then
              echo "Error: todo/$fs/recipe.yaml missing" >&2
              exit 1
            fi
            cp -a "todo/$fs" ".import-artifact/todo/$fs"
          done

          if [[ -f only-meta.txt ]]; then
            cp -a only-meta.txt .import-artifact/only-meta.txt
          fi

          echo "Artifact staging tree:"
          find .import-artifact -maxdepth 3 -print | sort
          echo "--- manifest ---"
          cat .import-artifact/todo/import-manifest.json

      - uses: actions/upload-artifact@v7
        if: steps.import.outputs.should_build == 'true'
        with:
          name: prepared-recipes
          path: .import-artifact/
          include-hidden-files: true
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 2. Build every prepared recipe inside pixi for each target arch, upload
  # -------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    # Use should_build (explicit) rather than "not already_on_scns".
    # Compare prepare_only as string: workflow_dispatch booleans are strings.
    if: |
      needs.prepare.outputs.should_build == 'true'
      && inputs.prepare_only != true
      && inputs.prepare_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-64, os: ubuntu-22.04 }
          - { target: linux-aarch64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: prepared-recipes
          path: ${{ github.workspace }}

      - name: Verify prepared artifact
        shell: bash
        env:
          FEEDSTOCKS: ${{ needs.prepare.outputs.feedstocks }}
          RECIPE: ${{ needs.prepare.outputs.recipe }}
        run: |
          set -Eeuo pipefail

          echo "Workspace after artifact download:"
          ls -la
          echo "todo/ after download:"
          ls -la todo/ 2>/dev/null || echo "(no todo/)"

          # download-artifact may place files at workspace root or under a
          # nested .import-artifact/ depending on how the archive was rooted.
          if [[ ! -f todo/import-manifest.json ]]; then
            if [[ -f .import-artifact/todo/import-manifest.json ]]; then
              echo "Flattening nested .import-artifact/ layout"
              mkdir -p todo
              cp -a .import-artifact/todo/. todo/
              if [[ -f .import-artifact/only-meta.txt ]]; then
                cp -a .import-artifact/only-meta.txt only-meta.txt
              fi
            fi
          fi

          if [[ ! -f todo/import-manifest.json ]]; then
            if [[ -n "${FEEDSTOCKS:-}" ]]; then
              echo "Synthesizing todo/import-manifest.json from job outputs"
              mkdir -p todo
              python3 -c '
          import json, os
          from pathlib import Path
          feedstocks = [f.strip() for f in os.environ["FEEDSTOCKS"].split(",") if f.strip()]
          root_pkg = os.environ.get("RECIPE", feedstocks[0] if feedstocks else "")
          data = {
              "root_package": root_pkg,
              "feedstocks": feedstocks,
              "reasons": {fs: "from prepare job outputs" for fs in feedstocks},
              "target_platform": os.environ.get("TARGET_PLATFORM", "linux-64"),
              "should_build": True,
              "already_on_scns": False,
          }
          Path("todo/import-manifest.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          '
            else
              echo "Error: todo/import-manifest.json missing after artifact download" >&2
              find . \( -name 'import-manifest.json' -o -name '.import-manifest.json' \) 2>/dev/null || true
              exit 1
            fi
          fi

          echo "--- todo/import-manifest.json ---"
          cat todo/import-manifest.json

          IFS=',' read -ra FS_LIST <<< "$FEEDSTOCKS"
          for fs in "${FS_LIST[@]}"; do
            fs="${fs#"${fs%%[![:space:]]*}"}"
            fs="${fs%"${fs##*[![:space:]]}"}"
            [[ -z "$fs" ]] && continue
            if [[ ! -f "todo/$fs/recipe.yaml" ]]; then
              echo "Error: missing todo/$fs/recipe.yaml after artifact download" >&2
              exit 1
            fi
            echo "OK todo/$fs/recipe.yaml"
          done

      - name: Build & upload in pixi container
        id: build
        shell: bash
        env:
          PREFIX_DEV_TOKEN: ${{ secrets.PREFIX_DEV_TOKEN }}
          TARGET_PLATFORM: ${{ matrix.target }}
          RECIPE: ${{ needs.prepare.outputs.recipe }}
          IMPORT_FEEDSTOCKS: ${{ needs.prepare.outputs.feedstocks }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${PREFIX_DEV_TOKEN:-}" ]]; then
            echo "Error: secrets.PREFIX_DEV_TOKEN is not set; cannot upload to scns." >&2
            exit 1
          fi

          chmod +x scripts/*.sh scripts/lib/*.sh || true
          mkdir -p logs output
          docker --version

          echo "Building feedstocks: ${IMPORT_FEEDSTOCKS}"
          python3 scripts/import_recipe.py "$RECIPE" \
            --build-only \
            --target-platform="$TARGET_PLATFORM" \
            --token="$PREFIX_DEV_TOKEN"

      - name: Check build artifacts
        id: check-artifacts
        if: success()
        shell: bash
        env:
          RECIPE: ${{ needs.prepare.outputs.recipe }}
          TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail

          # Count .conda artifacts produced by the build.
          conda_files=()
          if [[ -d output ]]; then
            shopt -s nullglob globstar
            conda_files=(output/**/*.conda)
            shopt -u nullglob globstar
          fi

          if [[ ${#conda_files[@]} -gt 0 ]]; then
            echo "Found ${#conda_files[@]} .conda artifact(s) for ${TARGET}:"
            printf '  %s\n' "${conda_files[@]}"
            echo "true" > "output/.build-status-${TARGET}"
            exit 0
          fi

          echo "Warning: no .conda artifacts under output/ for ${TARGET}."
          echo "All packages may have been skipped as existing."

          # Check whether the package is already available on scns.
          echo "Checking scns channel for ${RECIPE}..."
          found_on_scns=false
          for arch in noarch linux-64; do
            url="https://prefix.dev/scns/${arch}/repodata.json"
            echo "  Querying ${url} ..."
            if python3 -c "
import json, sys, urllib.request
pkg = sys.argv[1]
url = sys.argv[2]
try:
    req = urllib.request.Request(url)
    with urllib.request.urlopen(req, timeout=60) as f:
        data = json.load(f)
    for pkg_name in data.get('packages', {}):
        if pkg_name.startswith(pkg + '-'):
            print(f'FOUND:{pkg_name}')
            sys.exit(0)
    sys.exit(1)
except Exception as e:
    print(f'ERROR:{e}', file=sys.stderr)
    sys.exit(2)
" "$RECIPE" "$url"; then
              found_on_scns=true
              break
            fi
          done

          if [[ "$found_on_scns" == "true" ]]; then
            echo "Package ${RECIPE} already exists on scns — no build needed."
            echo "false" > "output/.build-status-${TARGET}"
          else
            echo "::error::No .conda artifacts for ${RECIPE} (${TARGET}) and package not found on scns. Build may have failed."
            exit 1
          fi

      - name: Fix output/logs ownership for the runner
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          echo "Restoring ownership of output/ and logs/ to ${uid}:${gid}"

          if docker ps --filter "name=^/pixi$" --format '{{.Names}}' | grep -Fxq pixi; then
            docker exec \
              -e HOST_UID="$uid" \
              -e HOST_GID="$gid" \
              pixi bash -lc '
                set -Eeuo pipefail
                for d in output logs; do
                  [[ -e "$d" ]] || continue
                  chown -Rh "${HOST_UID}:${HOST_GID}" "$d" || true
                done
              ' || true
          fi

          if [[ -d output ]] || [[ -d logs ]]; then
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -Rh "${uid}:${gid}" output logs 2>/dev/null || true
            else
              chown -Rh "${uid}:${gid}" output logs 2>/dev/null || true
            fi
          fi

          if [[ -d output ]]; then
            find output -name '*.conda' -print 2>/dev/null | head -n 20 || true
            ls -la output || true
          fi

      - name: Summarize failure
        if: failure()
        shell: bash
        env:
          RECIPE: ${{ needs.prepare.outputs.recipe }}
          TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          log="logs/build-${TARGET}.log"
          {
            echo "## Build failed: ${RECIPE} (${TARGET})"
            echo
            echo '```text'
            if [[ -f "$log" ]]; then
              tail -n 200 "$log"
            else
              echo "No build log was captured at $log."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log-${{ matrix.target }}
          path: |
            logs/build-${{ matrix.target }}.log
            output/**/*.conda
            output/.build-status-*
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # 3. On full success, commit prepared recipes into recipes/
  # -------------------------------------------------------------------------
  commit:
    name: Commit recipes
    needs:
      - prepare
      - build
    if: |
      always()
      && needs.prepare.outputs.should_build == 'true'
      && needs.prepare.result == 'success'
      && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: prepared-recipes
          path: ${{ github.workspace }}

      - name: Download build-log artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: build-log-*
          path: ${{ github.workspace }}/.build-logs
          merge-multiple: true

      - name: Check whether any target produced .conda artifacts
        id: build-gate
        shell: bash
        run: |
          set -Eeuo pipefail

          any_artifacts=false
          if [[ -d .build-logs/output ]]; then
            shopt -s nullglob
            status_files=(.build-logs/output/.build-status-*)
            shopt -u nullglob

            for sf in "${status_files[@]}"; do
              echo "Status file: $(basename "$sf") = $(cat "$sf")"
              if [[ "$(cat "$sf")" == "true" ]]; then
                any_artifacts=true
              fi
            done

            # Also check for actual .conda files as a fallback
            shopt -s nullglob globstar
            conda_files=(.build-logs/output/**/*.conda)
            shopt -u nullglob globstar
            if [[ ${#conda_files[@]} -gt 0 ]]; then
              echo "Found ${#conda_files[@]} .conda file(s) in build logs."
              any_artifacts=true
            fi
          fi

          if [[ "$any_artifacts" == "true" ]]; then
            echo "At least one target produced .conda artifacts — proceeding to commit."
          else
            echo "No target produced .conda artifacts — skipping commit."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive prepared feedstocks into recipes/
        if: steps.build-gate.outputs.skipped != 'true'
        shell: bash
        env:
          FEEDSTOCKS: ${{ needs.prepare.outputs.feedstocks }}
          ROOT_PKG: ${{ needs.prepare.outputs.recipe }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ ! -d todo ]] && [[ -d .import-artifact/todo ]]; then
            cp -a .import-artifact/todo todo
          elif [[ -d .import-artifact/todo ]]; then
            mkdir -p todo
            cp -a .import-artifact/todo/. todo/ 2>/dev/null || true
          fi

          mkdir -p recipes
          IFS=',' read -ra FS_LIST <<< "$FEEDSTOCKS"
          archived=()
          for fs in "${FS_LIST[@]}"; do
            fs="${fs#"${fs%%[![:space:]]*}"}"
            fs="${fs%"${fs##*[![:space:]]}"}"
            [[ -z "$fs" ]] && continue
            if [[ -d "todo/$fs" ]]; then
              rm -rf "recipes/$fs"
              mv "todo/$fs" "recipes/$fs"
              archived+=("$fs")
            fi
          done

          rm -f todo/import-manifest.json todo/.import-manifest.json todo/import-status.json
          rm -rf todo/.import-stage .import-artifact

          if [[ ${#archived[@]} -eq 0 ]]; then
            echo "No feedstocks to archive."
            exit 0
          fi

          git add recipes/ todo/ only-meta.txt 2>/dev/null || git add recipes/
          if git diff --cached --quiet; then
            echo "No recipe changes to commit."
            exit 0
          fi

          git commit -m "import $(IFS=,; echo "${archived[*]}") (root: ${ROOT_PKG})"
          git push
