name: Import recipe from conda-forge

# Manually import a package (and any missing deps) from conda-forge into todo/,
# convert to recipe.yaml, build inside the pixi container for linux-64 and
# linux-aarch64, then upload artifacts to https://prefix.dev/scns.
#
# Logic lives in scripts/import_recipe.py — this workflow only wires inputs,
# matrix targets, secrets, and artifacts.

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Package name (conda-forge output or feedstock), e.g. yaml-cpp'
        required: true
        type: string
      prepare_only:
        description: 'Only resolve/prep recipes into todo/ (skip build & upload)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DEFAULT_CHANNEL: https://prefix.dev/scns

jobs:
  # -------------------------------------------------------------------------
  # 1. Validate input, recursively prep recipes + missing deps into todo/
  # -------------------------------------------------------------------------
  prepare:
    name: Resolve & prepare
    runs-on: ubuntu-22.04
    outputs:
      recipe: ${{ steps.normalize.outputs.recipe }}
      feedstocks: ${{ steps.import.outputs.feedstocks }}
      already_on_scns: ${{ steps.import.outputs.already_on_scns }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: normalize
        name: Normalize package name
        shell: bash
        env:
          RECIPE_INPUT: ${{ inputs.recipe }}
        run: |
          set -Eeuo pipefail

          recipe="$RECIPE_INPUT"
          recipe="${recipe#"${recipe%%[![:space:]]*}"}"
          recipe="${recipe%"${recipe##*[![:space:]]}"}"

          if [[ -z "$recipe" || ! "$recipe" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid package name: '${RECIPE_INPUT}'" >&2
            echo "Allowed characters: letters, numbers, dots, underscores, hyphens." >&2
            exit 1
          fi

          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
          echo "Importing package: $recipe"

      - name: Install pixi tools (conda, crm, rattler-build)
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/setup_pixi.sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pixi/bin:$PATH"
          command -v conda
          command -v crm
          command -v rattler-build
          python3 --version

      - id: import
        name: Resolve deps and prep recipes
        shell: bash
        env:
          RECIPE: ${{ steps.normalize.outputs.recipe }}
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.pixi/bin:$PATH"

          # prepare-only: build happens per-arch in the next job inside pixi.
          set +e
          python3 scripts/import_recipe.py "$RECIPE" --prepare-only
          rc=$?
          set -e

          if [[ $rc -ne 0 ]]; then
            echo "::error::import_recipe.py failed while preparing '$RECIPE' (exit $rc). See log above for the concrete reason."
            exit "$rc"
          fi

          manifest="todo/.import-manifest.json"
          if [[ ! -f "$manifest" ]]; then
            # Package already on scns → script exits 0 without a manifest.
            echo "already_on_scns=true" >> "$GITHUB_OUTPUT"
            echo "feedstocks=" >> "$GITHUB_OUTPUT"
            {
              echo "## Package already on scns"
              echo
              echo "Package \`$RECIPE\` is already present on https://prefix.dev/scns. No import needed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "already_on_scns=false" >> "$GITHUB_OUTPUT"
          feedstocks=$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))["feedstocks"]))' "$manifest")
          echo "feedstocks=$feedstocks" >> "$GITHUB_OUTPUT"
          echo "Prepared feedstocks: $feedstocks"

          {
            echo "## Prepared feedstocks"
            echo
            python3 -c '
          import json,sys
          m=json.load(open(sys.argv[1]))
          print("Root package: `{}`".format(m["root_package"]))
          print()
          print("| Feedstock | Reason |")
          print("| --- | --- |")
          for fs in m["feedstocks"]:
              print("| `{}` | {} |".format(fs, m["reasons"].get(fs, "")))
          ' "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: steps.import.outputs.already_on_scns != 'true'
        with:
          name: prepared-recipes
          path: |
            todo/
            only-meta.txt
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 2. Build every prepared recipe inside pixi for each target arch, upload
  # -------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.already_on_scns != 'true' && inputs.prepare_only == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-64, os: ubuntu-22.04 }
          - { target: linux-aarch64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: prepared-recipes
          path: ${{ github.workspace }}

      - name: Build & upload in pixi container
        id: build
        shell: bash
        env:
          PREFIX_DEV_TOKEN: ${{ secrets.PREFIX_DEV_TOKEN }}
          TARGET_PLATFORM: ${{ matrix.target }}
          RECIPE: ${{ needs.prepare.outputs.recipe }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${PREFIX_DEV_TOKEN:-}" ]]; then
            echo "Error: secrets.PREFIX_DEV_TOKEN is not set; cannot upload to scns." >&2
            exit 1
          fi

          chmod +x scripts/*.sh scripts/lib/*.sh || true
          mkdir -p logs output
          docker --version

          # Build-only: read todo/.import-manifest.json, start pixi via
          # start_img.sh --run, rattler-build, then upload to scns.
          python3 scripts/import_recipe.py "$RECIPE" \
            --build-only \
            --target-platform="$TARGET_PLATFORM" \
            --token="$PREFIX_DEV_TOKEN"

      - name: Summarize failure
        if: failure()
        shell: bash
        env:
          RECIPE: ${{ needs.prepare.outputs.recipe }}
          TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          log="logs/build-${TARGET}.log"
          {
            echo "## Build failed: ${RECIPE} (${TARGET})"
            echo
            echo '```text'
            if [[ -f "$log" ]]; then
              tail -n 200 "$log"
            else
              echo "No build log was captured at $log."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log-${{ matrix.target }}
          path: |
            logs/build-${{ matrix.target }}.log
            output/**/*.conda
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # 3. On full success, commit prepared recipes into recipes/
  # -------------------------------------------------------------------------
  commit:
    name: Commit recipes
    needs:
      - prepare
      - build
    # Only archive after a real multi-arch build+upload success.
    if: |
      always()
      && needs.prepare.outputs.already_on_scns != 'true'
      && needs.prepare.result == 'success'
      && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: prepared-recipes
          path: ${{ github.workspace }}

      - name: Archive prepared feedstocks into recipes/
        shell: bash
        env:
          FEEDSTOCKS: ${{ needs.prepare.outputs.feedstocks }}
          ROOT_PKG: ${{ needs.prepare.outputs.recipe }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p recipes
          IFS=',' read -ra FS_LIST <<< "$FEEDSTOCKS"
          archived=()
          for fs in "${FS_LIST[@]}"; do
            fs="${fs#"${fs%%[![:space:]]*}"}"
            fs="${fs%"${fs##*[![:space:]]}"}"
            [[ -z "$fs" ]] && continue
            if [[ -d "todo/$fs" ]]; then
              rm -rf "recipes/$fs"
              mv "todo/$fs" "recipes/$fs"
              archived+=("$fs")
            fi
          done

          # Drop import bookkeeping if present.
          rm -f todo/.import-manifest.json
          rm -rf todo/.import-stage

          if [[ ${#archived[@]} -eq 0 ]]; then
            echo "No feedstocks to archive."
            exit 0
          fi

          git add recipes/ todo/ only-meta.txt 2>/dev/null || git add recipes/
          if git diff --cached --quiet; then
            echo "No recipe changes to commit."
            exit 0
          fi

          git commit -m "import $(IFS=,; echo "${archived[*]}") (root: ${ROOT_PKG})"
          git push
