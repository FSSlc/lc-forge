schema_version: 1

context:
  xorg_name: libxshmfence
  xorg_category: lib
  name: xorg-libxshmfence
  version: 1.3.2
  sha256: e93a85099604beb244ee756dcaf70e18b08701c1ca84c4de0126cd71bd6c8181
  am_version: 1.15

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://www.x.org/releases/individual/${{ xorg_category }}/${{ xorg_name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - if: win
      then: windows.patch

build:
  number: 3
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - if: win
      then: m2-autoconf
    - if: win
      then: m2-automake${{ am_version }}
    - if: win
      then: m2-libtool
    - if: win
      then: m2w64-pkg-config
    - if: not win
      then: pkg-config
    - if: win
      then: posix
    - if: unix
      then: gnuconfig      
    - if: unix
      then: ${{ compiler('c') }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: unix
      then: make
    - if: unix
      then: autoconf
    - if: unix
      then: automake
    - if: unix
      then: gettext
    - if: unix
      then: libtool    
  host:
    - pthread-stubs
    - xorg-xorgproto
    - xorg-util-macros
  run:
    - if: win
      then: m2w64-libwinpthread-git

tests:
  - script:
      - if: osx
        then: test -f $PREFIX/lib/libxshmfence.dylib
      - if: linux
        then: test -f $PREFIX/lib/libxshmfence.so
      - if: win
        then: if not exist %PREFIX%/Library/lib/libxshmfence.dll.a exit /b 1
      - if: win
        then: if not exist %PREFIX%/Library/bin/msys-Xi-*.dll exit /b 1
      - if: not win
        then: conda inspect linkages -p $PREFIX $PKG_NAME
      - if: osx
        then: conda inspect objects -p $PREFIX $PKG_NAME

about:
  homepage: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Shared memory 'SyncFence' synchronization primitive

extra:
  recipe-maintainers:
    - ehfd
