schema_version: 1

context:
  name: mercurial
  version: "7.1.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ce27b9a4767cf2ea496b51468bae512fa6a6eaf0891e49f8961dc694b4dc81ca

build:
  # skip: true  # [py>311 and linux]
  number: 0

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python

tests:
  - script:
      - hg --version
      - hg debuginstall

about:
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Source control management tool
  description: |
    Mercurial is a distributed SCM tool written in Python.
    It is used by a number of large projects that require
    fast, reliable distributed revision control, such as
    Mozilla.


  homepage: http://mercurial-scm.org

extra:
  recipe-maintainers:
    - paugier

