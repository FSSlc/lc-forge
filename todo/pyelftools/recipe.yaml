schema_version: 1

context:
  version: "0.33"

package:
  name: pyelftools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyelftools/pyelftools-${{ version }}.tar.gz
  sha256: 660d82dcbeb8e83d1702bd97f223f761625da06111c0cc988eac6b8ab0c1b61f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=46.4.0
    - pip
  run:
    - python >=${{ python_min }}
    - if: unix
      then: __unix
    - if: win
      then: __win

tests:
  - python:
      imports:
        - elftools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Library for analyzing ELF files and DWARF debugging information
  license: Unlicense
  license_file: LICENSE
  homepage: https://github.com/eliben/pyelftools

extra:
  recipe-maintainers:
    - msarahan
    - ocefpaf
