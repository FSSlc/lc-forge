schema_version: 1

context:
  version: "2.0.1"

package:
  name: imagesize
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/i/imagesize/imagesize-${{ version }}.tar.gz
  sha256: b2ba6a4dea487a7ebcd53248d3476aca449d30db12a2dde5e0c5ca9624fd77e5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - imagesize
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.rst
  summary: Getting image size from png/jpeg/jpeg2000/gif file
  description: |
    This module analyzes jpeg/jpeg2000/png/gif image header and
    return image size.
  homepage: https://github.com/shibukawa/imagesize_py
  repository: https://github.com/shibukawa/imagesize_py

extra:
  recipe-maintainers:
    - chohner

