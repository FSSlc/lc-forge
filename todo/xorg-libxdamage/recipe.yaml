schema_version: 1

context:
  xorg_name: libXdamage
  xorg_category: lib
  name: xorg-libXdamage
  version: 1.1.6
  sha256: 52733c1f5262fca35f64e7d5060c6fcd81a880ba8e1e65c9621cf0727afb5d11
  am_version: 1.15

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://www.x.org/releases/individual/${{ xorg_category }}/${{ xorg_name }}-${{ version }}.tar.xz
  sha256: ${{ sha256 }}

build:
  number: 0
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - if: win
      then: m2-autoconf
    - if: win
      then: m2-automake${{ am_version }}
    - if: win
      then: m2-libtool
    - if: win
      then: m2w64-pkg-config
    - if: not win
      then: pkg-config
    - if: win
      then: posix
    - if: unix
      then: ${{ compiler('c') }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: unix
      then: make
    - if: unix
      then: gnuconfig
  host:
    - xorg-xorgproto
    - xorg-libx11 1.7.*
    - xorg-libxext 1.3.*
    - xorg-libxfixes
    - xorg-util-macros

tests:
  - script:
      - if: osx
        then: test -f $PREFIX/lib/libXdamage.dylib
      - if: linux
        then: test -f $PREFIX/lib/libXdamage.so
      - if: win
        then: if not exist %PREFIX%/Library/lib/libXdamage.dll.a exit /b 1
      - if: win
        then: if not exist %PREFIX%/Library/bin/msys-Xi-*.dll exit /b 1
      - if: not win
        then: conda inspect linkages -p $PREFIX $PKG_NAME
      - if: osx
        then: conda inspect objects -p $PREFIX $PKG_NAME

about:
  homepage: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: 'The X.org X11 Damage Extension library .'

extra:
  recipe-maintainers:
    - zklaus
