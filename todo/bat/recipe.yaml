schema_version: 1

context:
  version: "0.26.1"

package:
  name: bat
  version: ${{ version }}

source:
  url: https://github.com/sharkdp/bat/archive/v${{ version }}.tar.gz
  sha256: 4474de87e084953eefc1120cf905a79f72bbbf85091e30cf37c9214eafcaa9c9

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses

tests:
  - script:
      - bat --help

about:
  license: MIT
  summary: A cat(1) clone with syntax highlighting and Git integration
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml
  homepage: https://github.com/sharkdp/bat

extra:
  recipe-maintainers:
    - apcamargo
    - dbast

