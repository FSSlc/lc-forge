# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.18"

recipe:
  name: libnuma-split
  version: ${{ version }}

source:
  url: https://github.com/numactl/numactl/releases/download/v${{ version }}/numactl-${{ version }}.tar.gz
  sha256: b4fc0956317680579992d7815bc43d0538960dc73aa1dd8ca7e3806e30bc1274
  patches:
    # These tests require NUMA topology that is unavailable in some CI environments.
    # https://github.com/conda-forge/numactl-feedstock/pull/1#issuecomment-1425000697
    # https://github.com/numactl/numactl/issues/163
    # https://github.com/numactl/numactl/issues/164
    - if: aarch64 or ppc64le or riscv64
      then: skip_failing_tests.patch
    - if: ppc64le
      then: fix_ppc64le_set_mempolicy_home_node.patch

build:
  number: 4
  skip: [win, osx]

# about/context/source are inherited by every output below.
about:
  homepage: https://github.com/numactl/numactl
  repository: https://github.com/numactl/numactl
  documentation: https://linux.die.net/man/8/numactl
  license: LGPL-2.1-only
  license_file: LICENSE.LGPL2.1
  summary: NUMA support for Linux
  description: |
    Simple NUMA policy support. It consists of a numactl program to run other
    programs with a specific NUMA policy and a libnuma shared library
    ("NUMA API") to set NUMA policy in applications.

extra:
  recipe-maintainers:
    - kkraus14
    - chrisburr
    - zklaus

outputs:
  # Staging output: compiles the tree once (autoreconf + configure + make + make check).
  # The work directory is cached, so the package outputs below only run their own
  # `make install-*` target instead of recompiling.
  - staging:
      name: numactl-build
    build:
      script: build.sh
    requirements:
      build:
        - automake
        - autoconf
        - coreutils
        - grep
        - libtool
        - sed
        - gnuconfig
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - make

  # Runtime library: libnuma.so + headers + pkg-config
  - package:
      name: libnuma
    inherit: numactl-build
    build:
      script: install-libnuma.sh
      files:
        - include
        - lib/libnuma*
        - lib/pkgconfig
    requirements:
      run_exports:
        - ${{ pin_subpackage('libnuma', upper_bound='x') }}
    tests:
      - script:
          - test -f $PREFIX/lib/libnuma.so
          - test ! -f $PREFIX/lib/libnuma.a
          - test -f $PREFIX/lib/pkgconfig/numa.pc

  # Command line tools and manual pages.
  # `make install` also reinstalls the libnuma files; the files: selector keeps
  # them out of this package so the two outputs stay disjoint.
  - package:
      name: numactl
    inherit: numactl-build
    build:
      script: install-numactl.sh
      files:
        - bin
        - share
    requirements:
      run:
        - ${{ pin_subpackage('libnuma', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libnuma', upper_bound='x') }}
    about:
      license: GPL-2.0-only
      license_file: LICENSE.GPL2
    tests:
      - script:
          - if: not (aarch64 or ppc64le or riscv64)
            then: numactl --show
