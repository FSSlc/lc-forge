schema_version: 1

context:
  name: typing-inspection
  version: "0.4.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/typing_inspection-${{ version }}.tar.gz
  sha256: 7f16c411e7930dc79596d42ab44672a3fe5f60eb34b781a1647e7872363120c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.15.0
tests:
  - python:
      imports:
        - typing_inspection
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Runtime typing introspection tools
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pydantic/typing-inspection
  repository: https://github.com/pydantic/typing-inspection

extra:
  recipe-maintainers:
    - jan-janssen
