schema_version: 1

context:
  major_minor: "2.24"
  version: ${{ major_minor + ".33" }}

package:
  name: gtk2
  version: ${{ version }}

source:
  # TODO: consider a few patches from ubuntu
  # https://salsa.debian.org/gnome-team/gtk2/-/tree/ubuntu/master/debian/patches
  url: http://ftp.gnome.org/pub/GNOME/sources/gtk+/${{ major_minor }}/gtk+-${{ version }}.tar.xz
  sha256: ac2ac757f5942d318a311a54b0c80b5ef295f299c2a73c632f6bfb1ff49cc6da

build:
  number: 8
  skip: win

requirements:
  build:
    - make
    - pkg-config
    - perl *
    - if: unix
      then: gnuconfig
    - gobject-introspection
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - gettext-tools
    - if: build_platform != target_platform
      then: atk
    - if: build_platform != target_platform
      then: cairo
    - if: build_platform != target_platform
      then: gdk-pixbuf
    - if: build_platform != target_platform
      then: glib
    - if: build_platform != target_platform
      then: pango
    # needed for devel files (e.g. pkg-config):
    - if: build_platform != target_platform
      then: expat
    - if: build_platform != target_platform
      then: liblzma-devel
    - if: build_platform != target_platform
      then: xorg-xorgproto
    - if: build_platform != target_platform
      then: zlib
  host:
    - atk
    - cairo
    - gdk-pixbuf
    - glib
    - pango
    - if: osx
      then: libintl-devel
    - if: linux
      then: fontconfig
    - if: linux
      then: freetype
    - if: linux
      then: harfbuzz
    - if: linux
      then: xorg-libx11
    - if: linux
      then: xorg-libxext
    - if: linux
      then: xorg-libxrender
    - expat
    - liblzma-devel
    - xorg-xorgproto
    - zlib
  ignore_run_exports:
    by_name:
      - libexpat
      - liblzma
      - libzlib

tests:
  - script:
      - if: linux
        then: test -f ${PREFIX}/lib/libgtk-x11-2.0${{ SHLIB_EXT }}
      - if: osx
        then: test -f ${PREFIX}/lib/libgtk-quartz-2.0${{ SHLIB_EXT }}

about:
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: Primary library used to construct user interfaces in GNOME applications
  homepage: https://developer.gnome.org/gtk/

extra:
  recipe-maintainers:
    - jakirkham
    - pkgw
    - xhochy

