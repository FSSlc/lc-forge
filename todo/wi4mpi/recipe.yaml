# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.0.1"

package:
  name: wi4mpi
  version: ${{ version }}

source:
  url: https://github.com/wi4mpi/wi4mpi/releases/download/v${{ version }}/wi4mpi-${{ version }}.tar.gz
  sha256: a37374fa9d6f330350d3e42a279038ea9e164ce2e3afd69817126253bd732c05

build:
  number: 0
  skip: [win, osx]
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  run:
    - bash
    - coreutils

tests:
  # Everything is installed under opt/wi4mpi, so it can live next to a real MPI
  # implementation in the same prefix; the activation script is what puts it on
  # PATH and points the target MPI roots at the prefix.
  - script:
      - test "${WI4MPI_ROOT}" = "${PREFIX}/opt/wi4mpi"
      - echo "${PATH}" | tr ':' '\n' | grep -qx "${WI4MPI_ROOT}/bin"
      - test "$(dirname "${WI4MPI_CC}")" = "${CONDA_PREFIX}/bin"
      - test "${OPENMPI_ROOT}" = "${CONDA_PREFIX}"
      - test "${MPICH_ROOT}" = "${CONDA_PREFIX}"
      - test -f ${PREFIX}/etc/conda/activate.d/wi4mpi_activate.sh
      - test -f ${PREFIX}/etc/conda/deactivate.d/wi4mpi_deactivate.sh
      - test -x ${WI4MPI_ROOT}/bin/wi4mpi
      - test -x ${WI4MPI_ROOT}/bin/mpicc
      - test -e ${WI4MPI_ROOT}/bin/mpifort
      - test -f ${WI4MPI_ROOT}/lib/libmpi.so
      - test -f ${WI4MPI_ROOT}/lib/libmpi.a
      - test -f ${WI4MPI_ROOT}/lib_OMPI/libwi4mpi_OMPI.so
      - test -f ${WI4MPI_ROOT}/lib_MPICH/libwi4mpi_MPICH.so
      - test -f ${WI4MPI_ROOT}/libexec/wi4mpi/libwi4mpi_OMPI_OMPI.so
      - test -f ${WI4MPI_ROOT}/libexec/wi4mpi/libwi4mpi_MPICH_OMPI.so
      - test -f ${WI4MPI_ROOT}/libexec/wi4mpi/fakelibOMPI/libmpi.so.40
      - test -f ${WI4MPI_ROOT}/libexec/wi4mpi/fakelibMPICH/libmpi.so.12
      - test -f ${WI4MPI_ROOT}/include/mpi.h
      - test -f ${WI4MPI_ROOT}/include/mpi.mod
      - test -f ${WI4MPI_ROOT}/include/mpif.h
      - test -f ${WI4MPI_ROOT}/include/gnu/mpif-sizeof.h
      - test -f ${WI4MPI_ROOT}/etc/wi4mpi.cfg
      - grep -q '^WI4MPI_VERSION=' ${WI4MPI_ROOT}/etc/wi4mpi.cfg
      - test -f ${WI4MPI_ROOT}/share/wi4mpi/setup-env.sh
      # Nothing of wi4mpi itself may sit at the top of the prefix, otherwise it
      # clashes with a real MPI installed in the same environment.
      - test ! -e ${PREFIX}/bin/mpicc
      - test ! -e ${PREFIX}/include/mpi.h
      - test ! -e ${PREFIX}/lib/libmpi.so

  # Target MPI resolution: with OPENMPI_ROOT pointing at the prefix, the
  # launcher must pick openmpi's libraries up from <prefix>/lib without any
  # extra environment.
  - requirements:
      run:
        - openmpi
    script:
      # timeout: the launcher parses its arguments with getopt(1); bounding it
      # keeps a broken/no util-linux environment from hanging the test.
      - timeout 30 wi4mpi -t openmpi --env | grep -qx "export WI4MPI_RUN_MPI_C_LIB=${CONDA_PREFIX}/lib/libmpi.so"
      - timeout 30 wi4mpi -t openmpi --env | grep -qx "export WI4MPI_WRAPPER_LIB=${WI4MPI_ROOT}/lib_OMPI/libwi4mpi_OMPI.so"

  # C wrapper compiler: flags come from the installed etc/wi4mpi.cfg and the
  # program links against wi4mpi's own libmpi.so. No target MPI implementation
  # is required because MPI_Init is never called.
  - files:
      recipe:
        - test/wrapper_cc.c
    requirements:
      run:
        - ${{ compiler('c') }}
        # Pin the C stdlib to the build-time value; the newest sysroot on scns
        # uses .relr.dyn relocations that the scns binutils 2.36 cannot read.
        - ${{ stdlib('c') }}
    script:
      - mpicc -showme:version | grep -q '^Wi4MPI-'
      - mpicc -showme:compile | grep -q -- "-I${WI4MPI_ROOT}/include"
      - mpicc -o wrapper_cc test/wrapper_cc.c
      # libmpi.so is installed without an rpath, like upstream's own
      # run_settings.sh the loader needs $WI4MPI_ROOT/lib on LD_LIBRARY_PATH.
      - export LD_LIBRARY_PATH=${WI4MPI_ROOT}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}
      - ./wrapper_cc | grep -q 'wi4mpi wrapper ok'

  # Fortran wrapper compiler: also proves the installed mpi.mod is usable.
  - files:
      recipe:
        - test/wrapper_fortran.f90
    requirements:
      run:
        - ${{ compiler('fortran') }}
        - ${{ stdlib('c') }}
    script:
      - mpifort -o wrapper_fortran test/wrapper_fortran.f90
      - export LD_LIBRARY_PATH=${WI4MPI_ROOT}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}
      - ./wrapper_fortran | grep -q 'wi4mpi fortran wrapper ok'

about:
  license: BSD-3-Clause OR CECILL-B
  license_file:
    - LICENSE-BSD
    - LICENSE-CeCILL-B
  summary: MPI wrapper and interoperability library
  description: |
    Wi4MPI is an MPI wrapper that converts calls from a source MPI
    implementation to a target one, either by preloading a conversion library
    or by compiling the application once against Wi4MPI's universal MPI
    interface. Applications can be built against Open MPI, Intel MPI, MPICH,
    MVAPICH or MPC and then executed with a different MPI implementation
    without recompiling.

    Everything is installed under $CONDA_PREFIX/opt/wi4mpi -- the universal
    interface (include/mpi.h, mpi.mod, lib/libmpi.so, lib/libmpi.a), the
    conversion libraries for the openmpi, intelmpi, mpich and mpc families
    (lib_*, libexec/wi4mpi) and the wrapper compilers and launcher (bin/mpicc,
    bin/mpifort, bin/mpirun, bin/wi4mpi) -- so a real MPI implementation can be
    installed in the same environment without file clashes.

    The activation script puts $CONDA_PREFIX/opt/wi4mpi/bin on PATH and exports
    WI4MPI_ROOT, WI4MPI_CC/WI4MPI_CXX/WI4MPI_FC (the compilers of this prefix)
    and OPENMPI_ROOT/MPICH_ROOT (= $CONDA_PREFIX), so MPICH and Open MPI coming
    from the same environment are picked up automatically. Intel MPI and MPC are
    not part of the environment; set INTELMPI_ROOT / MPC_ROOT (or
    WI4MPI_RUN_MPI_C_LIB and WI4MPI_RUN_MPI_F_LIB) to use them from elsewhere.
  homepage: https://github.com/wi4mpi/wi4mpi
  repository: https://github.com/wi4mpi/wi4mpi
  documentation: https://wi4mpi.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - fsslc
