schema_version: 1

context:
  name: coreutils
  version: "9.5"
  sha256: cd328edeac92f6a665de9f323c93b712af1858bc2e0d88f3f7100469470a1b8a

recipe:
  name: coreutils-split
  version: ${{ version }}

source:
  url: http://ftp.gnu.org/gnu/${{ name }}/${{ name }}-${{ version }}.tar.xz
  sha256: ${{ sha256 }}

build:
  number: 0
  skip: win

outputs:
  - package:
      name: ${{ name }}
    build:
      script:
        file: build_coreutils.sh
    requirements:
      build:
        - ${{ compiler('c') }}
        - make
    tests:
      - script:
          - ln --relative --help
          - wc --version
          - cat --version
  - package:
      name: gnu-${{ name }}
    build:
      script:
        file: build_gnu-coreutils.sh
    requirements:
      build:
        - ${{ compiler('c') }}
        - make
    tests:
      - script:
          - gln --relative --help
          - if: linux64
            then: ln --version
          - if: linux64
            then: gln --version
          - gwc --version
          - gcat --version

about:
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: The GNU Core Utilities are the basic file, shell and text manipulation utilities of the GNU operating system.
  homepage: https://www.gnu.org/software/coreutils
  repository: http://git.savannah.gnu.org/cgit/coreutils.git
  documentation: https://www.gnu.org/software/coreutils/manual/html_node/index.html

extra:
  recipe-maintainers:
    - ngam
    - sodre
    - mbargull
  feedstock-name: coreutils

