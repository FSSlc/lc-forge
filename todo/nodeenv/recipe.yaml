schema_version: 1

context:
  name: nodeenv
  version: "1.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ekalinin/nodeenv/archive/${{ version }}.tar.gz
  sha256: f3440cca5e907a733727b799d065ec56a9cd4be99ef5608eee0b7689d137893d
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - nodeenv = nodeenv:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools  # depends on pkg_resources at runtime

tests:
  - files:
      source:
        - tests
    requirements:
      run:
        - pytest
        - mock
        - coverage
        - python ${{ python_min }}.*
    script:
      - nodeenv --help
      - pytest tests -ra -k "not test_smoke"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Node.js virtual environment builder
  homepage: https://github.com/ekalinin/nodeenv

extra:
  recipe-maintainers:
    - nicoddemus

