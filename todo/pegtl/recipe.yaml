context:
  name: pegtl
  version: "3.2.8"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/taocpp/PEGTL/archive/refs/tags/${{ version }}.tar.gz
  sha256: 319e8238daebc3a163f60c88c78922a8012772076fdd64a8dafaf5619cd64773

build:
  number: 0
  script:
    - |
      cmake -S . -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DPEGTL_BUILD_TESTS=ON

      cmake --build build --parallel

      ctest --test-dir build \
            --output-on-failure \
            --parallel ${CPU_COUNT:-1}

      cmake --install build

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  host: []
  run: []

tests:
  - script:
      - test -f ${PREFIX}/include/tao/pegtl.hpp || test -f ${PREFIX}/include/tao/pegtl/version.hpp

about:
  homepage: https://github.com/taocpp/PEGTL
  repository: https://github.com/taocpp/PEGTL
  license: MIT
  license_file: LICENSE
  summary: Parsing Expression Grammar Template Library
  description: |
    PEGTL (Parsing Expression Grammar Template Library) is a zero-dependency
    C++ header-only parser combinator library for creating parsers using
    Parsing Expression Grammars (PEG).

extra:
  recipe-maintainers:
    - FSSlc
