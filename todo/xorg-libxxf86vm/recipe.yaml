schema_version: 1

context:
  xorg_name: libXxf86vm
  xorg_category: lib
  name: xorg-libXxf86vm
  version: 1.1.5
  sha256: 247fef48b3e0e7e67129e41f1e789e8d006ba47dba1c0cdce684b9b703f888e7
  am_version: 1.15

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://www.x.org/releases/individual/${{ xorg_category }}/${{ xorg_name }}-${{ version }}.tar.xz
  sha256: ${{ sha256 }}

build:
  number: 0
  prefix_detection:
    ignore_binary_files: true

requirements:
  build:
    - if: win
      then: m2-autoconf
    - if: win
      then: m2-automake${{ am_version }}
    - if: win
      then: m2-libtool
    - if: win
      then: m2w64-pkg-config
    - if: not win
      then: pkg-config
    - if: win
      then: posix
    - if: unix
      then: ${{ compiler('c') }}
    - if: win
      then: ${{ compiler('m2w64_c') }}
    - if: unix
      then: make
    - if: unix
      then: gnuconfig
    - if: unix
      then: autoconf
    - if: unix
      then: automake
    - if: unix
      then: gettext
    - if: unix
      then: libtool
  host:
    - xorg-util-macros
    - xorg-xorgproto
    - pthread-stubs
    - xorg-libx11 1.7.*
    - xorg-libxext 1.3.*
  run:
    - xorg-xorgproto
    - xorg-libx11 1.7.*
    - xorg-libxext 1.3.*

tests:
  - script:
      - if: osx
        then: test -f $PREFIX/lib/libXxf86vm.dylib
      - if: linux
        then: test -f $PREFIX/lib/libXxf86vm.so
      - if: win
        then: if not exist %PREFIX%/Library/lib/libXxf86vm.dll.a exit /b 1
      - if: win
        then: if not exist %PREFIX%/Library/bin/msys-Xi-*.dll exit /b 1
      - if: not win
        then: conda inspect linkages -p $PREFIX $PKG_NAME
      - if: osx
        then: conda inspect objects -p $PREFIX $PKG_NAME

about:
  homepage: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Xlib-based library for the XFree86-VidMode X extension

extra:
  recipe-maintainers:
    - hmaarrfk
    - pkgw
    - ehfd
