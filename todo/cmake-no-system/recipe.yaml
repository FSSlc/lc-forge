schema_version: 1

context:
  version: "4.3.3"
  version_major_minor: "4.3"

package:
  name: cmake-no-system
  version: ${{ version }}

source:
  - url: https://github.com/Kitware/CMake/releases/download/v${{ version }}/cmake-${{ version }}.tar.gz
    sha256: cba4bb7a44edf2877bb6f059932896383babe435b3a8c3b5df48b4aa41c9bb85
  - if: win
    then:
      - url: ${{ 'https://cmake.org/files/v${{ version_major_minor }}/cmake-${{ version }}-windows-x86_64.zip' if win else '' }}
        sha256: ${{ '935ade9e5e8723583c07f44c5592cea2a1c8f65c56ca7e07b34c025c880e0bd6' if win else '' }}
        target_directory: ${{ 'cmake-${{ version }}-windows' if win else '' }}

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: unix
      then: make
    - ninja
  run_constraints:
    - cmake ==dev

tests:
  - script:
      - cmake --version
      - ctest --version
      - cpack --version

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE.rst
    - Utilities/cmbzip2/LICENSE
    - Utilities/cmcppdap/LICENSE
    - Utilities/cmcurl/COPYING
    - Utilities/cmexpat/COPYING
    - Utilities/cmjsoncpp/LICENSE
    - Utilities/cmlibarchive/COPYING
    - Utilities/cmliblzma/COPYING
    - Utilities/cmlibrhash/COPYING
    - Utilities/cmlibuv/LICENSE
    - Utilities/cmzlib/Copyright.txt
    - Utilities/cmzstd/LICENSE
  summary: CMake built without system libraries for use when building CMake dependencies.
  homepage: http://www.cmake.org/

extra:
  recipe-maintainers:
    - jjhelmus
    - beckermr
    - xhochy

