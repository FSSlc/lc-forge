schema_version: 1

context:
  version: "0.4.2.post1"

package:
  name: beniget
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/beniget/beniget-${{ version }}.tar.gz
  sha256: a0258537e65e7e14ec33a86802f865a667f949bb6c73646d55e42f7c45a052ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - gast >=0.5.0

tests:
  - python:
      imports:
        - beniget
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Extract semantic information about static Python code
  homepage: https://github.com/serge-sans-paille/beniget
  repository: https://github.com/serge-sans-paille/beniget

extra:
  recipe-maintainers:
    - lc
