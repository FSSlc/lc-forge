schema_version: 1

context:
  name: xorg-libxcomposite
  version: "0.4.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://xorg.freedesktop.org/archive/individual/lib/libXcomposite-${{ version }}.tar.xz
  sha256: 8bdf310967f484503fa51714cf97bff0723d9b673e0eecbf92b3f97c060c8ccb

build:
  number: 0

requirements:
  build:
    - pkg-config
    - gnuconfig
    - make
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - xorg-xorgproto
    - xorg-libx11
    - xorg-libxfixes
    - xorg-util-macros

tests:
  - script:
      - test -f $PREFIX/lib/libXcomposite.so

about:
  homepage: https://www.x.org/
  license: MIT
  license_file: COPYING
  summary: X.org X11 Xlib-based client library for the Composite extension to the X11 protocol

extra:
  recipe-maintainers:
    - zklaus
