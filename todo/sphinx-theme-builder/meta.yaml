{% set name = "sphinx-theme-builder" %}
{% set version = "0.3.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 40b4bc2275b04d76781722c2e597770159e512f166986e1ceca1580a693f27bb

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - flit-core
    - pip
    - python {{ python_min }}
  run:
    - nodeenv
    - packaging
    - pyproject-metadata
    - python >={{ python_min }}
    - rich
    - setuptools
    - tomli
    - diagnostic

test:
  imports:
    - sphinx_theme_builder
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/sphinx-theme-builder/
  summary: A tool for authoring Sphinx themes with a simple (opinionated) workflow.
  dev_url: https://github.com/pradyunsg/sphinx_theme_builder
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gforsyth
