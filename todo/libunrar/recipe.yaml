schema_version: 1

context:
  name: libunrar
  version: "7.2.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://www.rarlab.com/rar/unrarsrc-${{ version }}.tar.gz
  sha256: 01d903a7dcf413cb2925696d7796e48e38d471f79bfe7ef3ad2aebf6c12dbefd
  patches:
    - if: unix
      then: 0001-REMOVE-HARDCODED-MAKEFILE-ENV.patch
    - if: osx
      then: 0002-REMOVE-INSTALL-OPTION.patch
    - if: osx
      then: 0003-CHANGE-DYLIB-EXTENSION.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - if: unix
      then: make
  run_exports:
    - ${{ pin_subpackage('libunrar', upper_bound='x.x.x') }}

tests:
  - script:
      - unrar
      - if: linux
        then: test -f $PREFIX/lib/libunrar.so
      - if: osx
        then: test -f $PREFIX/lib/libunrar.dylib
      - if: win
        then: if not exist %LIBRARY_LIB%\UnRAR.lib exit 1
      - if: win
        then: if not exist %LIBRARY_BIN%\unrar.dll exit 1
      - if: unix
        then: test -f $PREFIX/include/unrar/headers.hpp
      - if: win
        then: if not exist %LIBRARY_INC%\unrar\headers.hpp exit 1
      - if: unix
        then: test ! -f ${PREFIX}/lib/libunrar.a

about:
  summary: Free utility for RAR archives
  description:
  license: LicenseRef-UnRAR
  license_file: license.txt
  homepage: https://www.rarlab.com/
  repository: https://www.rarlab.com/rar_add.htm

extra:
  recipe-maintainers:
    - sshockwave

