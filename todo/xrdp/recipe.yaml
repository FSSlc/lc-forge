# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: xrdp
  version: "0.10.6.1"
  sha256: 2f7beb5a3b2529c8d72dc0df9b8cdca31ab0e0c14d1e3421210f5e6ec0ab3b75

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/neutrinolabs/xrdp/releases/download/v${{ version }}/xrdp-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    # keygen truncates the key file path into a 256-byte buffer, so the install
    # hook's "rsakeys.ini under $sysconfdir" path (rattler-build's 255-character
    # prefix placeholder + /etc/xrdp/...) is cut back to the prefix directory
    # and the build aborts with "problem deleting ...".
    - keygen-path-buffer.patch

build:
  number: 0
  skip:
    - win
    - osx  # Linux-only: PAM/utmp, AF_UNIX socket layout, Xorg module ABI

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}  # configure.ac calls AC_PROG_CXX unconditionally
    - ${{ stdlib('c') }}
    - make
    - pkg-config
    - nasm  # librfxcodec SIMD asm (x86/x86_64; unused on aarch64)
  host:
    - openssl
    - libxcrypt  # crypt.h / libcrypt for sesman's builtin auth (sysroot 2.17 has neither)
    - xorg-libx11
    - xorg-libxext
    - xorg-libxfixes
    - xorg-libxrandr
  run:
    - openssl
    - libxcrypt
    - xorg-libx11
    - xorg-libxfixes
    - xorg-libxrandr
  # configure calls AC_PROG_CXX, so gxx has to be installed, but xrdp is pure C:
  # no installed object needs libstdc++ (checked with readelf -d).
  ignore_run_exports:
    from_package:
      - ${{ compiler('cxx') }}

tests:
  - package_contents:
      files:
        - sbin/xrdp
        - sbin/xrdp-sesman
        - sbin/xrdp-chansrv
        - bin/xrdp-keygen
        - bin/xrdp-sesrun
        - bin/xrdp-sesadmin
        - libexec/xrdp/xrdp-sesexec
        - include/xrdp_sockets.h
        - etc/xrdp/xrdp.ini
        - etc/xrdp/sesman.ini
        - etc/xrdp/startwm.sh
  - script:
      # sbin is not on the test environment's PATH.
      - ${PREFIX}/sbin/xrdp --version > /dev/null
      - ${PREFIX}/sbin/xrdp-sesman --version > /dev/null
      # Exercises the keygen binary on a path it can write to.
      - xrdp-keygen xrdp "${TMPDIR:-/tmp}/xrdp-test-keys.ini"
      - grep -q '^\[keys\]' "${TMPDIR:-/tmp}/xrdp-test-keys.ini"
      # Key material generated by the install hook; these files are the
      # regression test for keygen-path-buffer.patch.
      - test -s "${PREFIX}/etc/xrdp/rsakeys.ini"
      - grep -q '^\[keys\]' "${PREFIX}/etc/xrdp/rsakeys.ini"
      - test -s "${PREFIX}/etc/xrdp/key.pem"
      - openssl x509 -in "${PREFIX}/etc/xrdp/cert.pem" -noout -subject
      # The daemon aborts during its sanity check if rsakeys.ini is missing, so
      # a live process plus the "listening to port" log line proves that the
      # compiled-in config paths, the socket dir and the key material agree.
      - |
        "${PREFIX}/sbin/xrdp" --nodaemon --port 13389 &
        xrdp_pid=$!
        sleep 3
        kill "$xrdp_pid"
        grep -q "listening to port 13389" "${PREFIX}/var/log/xrdp.log"

about:
  homepage: https://www.xrdp.org/
  repository: https://github.com/neutrinolabs/xrdp
  documentation: https://github.com/neutrinolabs/xrdp/wiki
  license: Apache-2.0
  license_file:
    - COPYING
    - third_party/COPYING-THIRD-PARTY
  summary: Open source RDP server
  description: |
    xrdp provides a graphical login to remote machines using Microsoft Remote
    Desktop Protocol (RDP).  It listens on 3389/tcp and hands the session over
    to xrdp-sesman, which starts an X server (Xorg with xorgxrdp, or Xvnc) for
    the authenticated user.

extra:
  recipe-maintainers:
    - fsslc
