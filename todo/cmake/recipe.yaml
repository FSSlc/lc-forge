schema_version: 1

context:
  version: "3.27.9"

package:
  name: cmake
  version: ${{ version }}

source:
  url: https://github.com/Kitware/CMake/releases/download/v${{ version }}/cmake-${{ version }}.tar.gz
  sha256: 609a9b98572a6a5ea477f912cffb973109ed4d0a6a6b3f9e2353d2cdc048708e

build:
  number: 0
  skip: win
  script:
    - ./bootstrap --prefix=$PREFIX --parallel=$CPU_COUNT -- \
        -DCMAKE_USE_OPENSSL=ON \
        -DCMake_ENABLE_CURL=ON \
        -DCMake_ENABLE_LIBARCHIVE=ON \
        -DCMAKE_BUILD_TYPE=Release
    - make -j$CPU_COUNT
    - make install

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
  host:
    - openssl
    - libcurl
    - libarchive
    - libuv
    - expat
    - zlib
    - bzip2
    - xz
    - libnghttp2
    - pcre2
    - libxml2
  run:
    - openssl
    - libcurl
    - libarchive
    - libuv
    - expat
    - zlib
    - bzip2
    - xz
    - libnghttp2
    - pcre2
    - libxml2

tests:
  - script:
      - cmake --version

about:
  homepage: https://cmake.org/
  repository: https://gitlab.kitware.com/cmake/cmake
  license: BSD-3-Clause
  summary: Cross-platform build system